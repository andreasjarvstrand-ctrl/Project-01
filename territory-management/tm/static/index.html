<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Territory Manager</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1c2330; --muted: #5d6778; --line: #dde1e8;
  --accent: #2459c7; --accent-soft: #e6edfb; --ok: #1f7a4d; --bad: #b3261e; --warn: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d3440;
          --accent: #7aa2ff; --accent-soft: #1f2b45; --ok: #5cc98f; --bad: #ff8a80; --warn: #e6b450; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; overflow-x: auto; }
h2 { font-size: 15px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button.btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button.danger { border-color: var(--bad); background: transparent; color: var(--bad); }
form.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12px; margin: 1px 2px 1px 0; }
.src-manual { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.muted { color: var(--muted); }
.add { color: var(--ok); } .rem { color: var(--bad); }
.bar { height: 6px; background: var(--accent); border-radius: 3px; min-width: 2px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; display: none; max-width: calc(100% - 32px); }
.readonly { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Territory Manager</h1>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <label class="muted">Scenario <select id="scenario"></select></label>
  <span id="ro" class="readonly"></span>
  <a id="export" class="btn ghost" style="text-decoration:none;color:var(--accent)" href="/api/scenarios/1/export.csv">Export CSV</a>
</header>
<main id="view"></main>
<footer class="muted" id="info" style="padding:0 16px 24px;text-align:center;font-size:12px"></footer>
<div id="toast"></div>
<script>
const TABS = { territories: "Territories", accounts: "Accounts", rules: "Rules", scenarios: "Scenarios", feedback: "Field feedback" };
const OPS = ["eq", "ne", "in", "not_in", "starts_with", "contains", "gte", "lte"];
let state = { tab: "territories", sid: 1, scenarios: [], forces: [] };

const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }
async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) { toast(data.error || "Request failed"); throw new Error(data.error); }
  return data;
}
const sc = () => state.scenarios.find(s => s.id === state.sid) || {};
const readonly = () => sc().status === "published";
const formData = f => Object.fromEntries(new FormData(f));

async function init() {
  try { state.tab = localStorage.getItem("tm.tab") || state.tab; } catch {}
  $("#tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}">${v}</button>`).join("");
  $("#tabs").onclick = e => { const k = e.target.dataset.tab; if (k) { state.tab = k; try { localStorage.setItem("tm.tab", k); } catch {} render(); } };
  $("#scenario").onchange = e => { state.sid = +e.target.value; render(); };
  state.forces = await api("/api/field-forces");
  api("/api/info").then(i => $("#info").textContent = `Territory Manager ${i.version} · works offline · data saved in ${i.database}`);
  await loadScenarios();
  render();
}
async function loadScenarios() {
  state.scenarios = await api("/api/scenarios");
  if (!state.scenarios.some(s => s.id === state.sid)) state.sid = 1;
  $("#scenario").innerHTML = state.scenarios.map(s => `<option value="${s.id}" ${s.id === state.sid ? "selected" : ""}>${esc(s.name)} (${s.status})</option>`).join("");
}
async function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  $("#ro").textContent = readonly() ? "read-only: published" : "";
  $("#export").href = `/api/scenarios/${state.sid}/export.csv`;
  $("#view").innerHTML = "<p class='muted'>Loading…</p>";
  await VIEWS[state.tab]();
}

const VIEWS = {
  async territories() {
    const rows = await api(`/api/scenarios/${state.sid}/territories`);
    const depth = {}; const byCode = Object.fromEntries(rows.map(r => [r.code, r]));
    const d = c => depth[c] ??= byCode[c]?.parent ? d(byCode[c].parent) + 1 : 0;
    const ordered = []; const visit = (p, ff) => rows.filter(r => (r.parent || null) === p && r.field_force === ff).forEach(r => { ordered.push(r); visit(r.code, ff); });
    state.forces.forEach(f => visit(null, f.code));
    const max = Math.max(1, ...rows.filter(r => !rows.some(c => c.parent === r.code)).map(r => r.workload));
    $("#view").innerHTML = `<section><h2>Territory hierarchy</h2><table>
      <tr><th>Territory</th><th>Field force</th><th class="num">Accounts</th><th class="num">Workload</th><th style="width:18%"></th><th>Roster</th><th></th></tr>
      ${ordered.map(r => { const leaf = !rows.some(c => c.parent === r.code); return `<tr>
        <td style="padding-left:${8 + d(r.code) * 20}px"><b>${esc(r.code)}</b> <span class="muted">${esc(r.name)}</span></td>
        <td>${esc(r.field_force)}</td><td class="num">${r.accounts}</td><td class="num">${r.workload}</td>
        <td>${leaf ? `<div class="bar" style="width:${(r.workload / max) * 100}%"></div>` : ""}</td>
        <td>${r.roster.map(p => `${esc(p.person)} <span class="muted">${esc(p.role)}</span>`).join("<br>") || (state.sid === 1 ? "<span class='muted'>vacant</span>" : "")}</td>
        <td>${readonly() ? "" : `<button class="btn danger" data-del="${esc(r.code)}">Delete</button>`}</td></tr>`; }).join("")}
      </table>
      ${readonly() ? "" : `<form class="row" id="newTerr">
        <input name="code" placeholder="Code" required size="10"><input name="name" placeholder="Name" required>
        <select name="field_force">${state.forces.map(f => `<option>${esc(f.code)}</option>`).join("")}</select>
        <select name="parent"><option value="">(no parent)</option>${rows.map(r => `<option>${esc(r.code)}</option>`).join("")}</select>
        <button class="btn">Add territory</button></form>`}
      <p class="muted">Workload = summed account potential. Bars compare leaf territories, so you can see balance at a glance.</p></section>
      <section><h2>Field forces</h2><table><tr><th>Code</th><th>Name</th><th>Targets accounts where</th></tr>
        ${state.forces.map(f => `<tr><td><b>${esc(f.code)}</b></td><td>${esc(f.name)}</td><td>${f.target_conditions.map(c => `${esc(c.field)} <b>${esc(c.op)}</b> ${esc(Array.isArray(c.value) ? c.value.join(" | ") : c.value)}`).join(" and ") || "<span class='muted'>all accounts</span>"}</td></tr>`).join("") || "<tr><td colspan=3 class='muted'>No field forces yet. Add one to start building territories.</td></tr>"}</table>
        <form class="row" id="newFF"><input name="code" placeholder="Code, e.g. HEM" required size="8"><input name="name" placeholder="Name" required>
          <span class="muted">targets</span><input name="field" placeholder="field (optional)" size="12"><select name="op">${OPS.map(o => `<option>${o}</option>`).join("")}</select>
          <input name="value" placeholder="value (| separates lists)"><button class="btn">Add field force</button></form></section>
      ${state.sid === 1 ? `<section><h2>Assign person</h2><form class="row" id="newRoster">
        <select name="territory">${rows.map(r => `<option>${esc(r.code)}</option>`).join("")}</select>
        <input name="person" placeholder="Name" required><input name="email" placeholder="Email" type="email">
        <select name="role"><option>rep</option><option>key account manager</option><option>manager</option></select>
        <button class="btn">Add to roster</button></form></section>` : ""}`;
    $("#view").onclick = async e => { const c = e.target.dataset.del; if (c && confirm(`Delete territory ${c} and its rules?`)) { await api(`/api/scenarios/${state.sid}/territories/${encodeURIComponent(c)}`, "DELETE"); render(); } };
    const nt = $("#newTerr"); if (nt) nt.onsubmit = async e => { e.preventDefault(); await api(`/api/scenarios/${state.sid}/territories`, "POST", formData(nt)); render(); };
    $("#newFF").onsubmit = async e => {
      e.preventDefault(); const d = formData(e.target);
      const conds = d.field ? [{ field: d.field, op: d.op, value: ["in", "not_in"].includes(d.op) ? d.value.split("|").map(x => x.trim()) : (["gte", "lte"].includes(d.op) ? +d.value : d.value) }] : [];
      await api("/api/field-forces", "POST", { code: d.code, name: d.name, target_conditions: conds });
      state.forces = await api("/api/field-forces"); render();
    };
    const nr = $("#newRoster"); if (nr) nr.onsubmit = async e => { e.preventDefault(); await api(`/api/roster`, "POST", formData(nr)); render(); };
  },

  async accounts() {
    $("#view").innerHTML = `<section><h2>Accounts and their alignment</h2>
      <input id="q" placeholder="Search name, city, specialty…" style="width:min(360px,100%)"><div id="list"></div></section>
      <section><h2>Import accounts (CSV)</h2><p class="muted">Columns: id, name, type, specialty, segment, postal_code, city, potential. Extra columns become attributes rules can use.</p>
      <textarea id="csv" rows="4" style="width:100%" placeholder="id,name,specialty,postal_code,potential"></textarea><p><button class="btn" id="imp">Import</button></p></section>`;
    const load = async () => {
      const rows = await api(`/api/scenarios/${state.sid}/accounts?q=${encodeURIComponent($("#q").value)}`);
      $("#list").innerHTML = `<table><tr><th>Account</th><th>Specialty</th><th>Segment</th><th>Postal code</th><th class="num">Potential</th><th>Territories (why)</th></tr>
        ${rows.map(a => `<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.id)} · ${esc(a.city)}</span></td><td>${esc(a.specialty)}</td><td>${esc(a.segment)}</td>
        <td>${esc(a.postal_code)}</td><td class="num">${a.potential}</td>
        <td>${a.assignments.map(x => `<span class="tag ${x.source === "manual" ? "src-manual" : ""}" title="${esc(x.detail)}">${esc(x.territory)}</span> <span class="muted">${esc(x.detail)}</span>`).join("<br>") || "<span class='muted'>unaligned</span>"}</td></tr>`).join("")}</table>`;
    };
    let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(load, 200); };
    $("#imp").onclick = async () => { const r = await api("/api/accounts/import", "POST", { csv: $("#csv").value }); toast(`Imported ${r.imported} accounts`); load(); };
    load();
  },

  async rules() {
    const [rules, terr] = await Promise.all([api(`/api/scenarios/${state.sid}/rules`), api(`/api/scenarios/${state.sid}/territories`)]);
    const tOpts = terr.map(t => `<option>${esc(t.code)}</option>`).join("");
    const del = (kind, id) => readonly() ? "" : `<button class="btn danger" data-kind="${kind}" data-id="${id}">Delete</button>`;
    const cond = c => `${esc(c.field)} <b>${esc(c.op)}</b> ${esc(Array.isArray(c.value) ? c.value.join(" | ") : c.value)}`;
    $("#view").innerHTML = `
      <section><h2>How alignment is decided</h2><ol class="muted" style="margin:0;padding-left:20px">
        <li>The account must match the field force's targeting (${state.forces.map(f => `${esc(f.code)}: ${f.target_conditions.map(cond).join(" and ") || "everyone"}`).join("; ")}).</li>
        <li>Manual includes always apply.</li><li>Account rules: all matches at the best priority assign; geography is then skipped.</li>
        <li>Geography rules: longest postal-code prefix wins.</li><li>Manual excludes remove a territory.</li></ol></section>
      <section><h2>Account rules</h2><table><tr><th class="num">Priority</th><th>Name</th><th>Conditions (all must match)</th><th>Territory</th><th></th></tr>
        ${rules.account.map(r => `<tr><td class="num">${r.priority}</td><td>${esc(r.name)}</td><td>${r.conditions.map(cond).join("<br>")}</td><td><span class="tag">${esc(r.territory)}</span></td><td>${del("account", r.id)}</td></tr>`).join("")}</table>
        ${readonly() ? "" : `<form class="row" id="fAcct"><input name="name" placeholder="Rule name"><input name="field" placeholder="Field, e.g. segment" required>
          <select name="op">${OPS.map(o => `<option>${o}</option>`).join("")}</select><input name="value" placeholder="Value (| separates lists)" required>
          <input name="priority" type="number" value="100" style="width:80px"><select name="territory">${tOpts}</select><button class="btn">Add rule</button></form>`}</section>
      <section><h2>Geography rules</h2><table><tr><th>Postal prefix</th><th>Territory</th><th></th></tr>
        ${rules.geo.map(r => `<tr><td>${esc(r.postal_prefix)}</td><td><span class="tag">${esc(r.territory)}</span></td><td>${del("geo", r.id)}</td></tr>`).join("")}</table>
        ${readonly() ? "" : `<form class="row" id="fGeo"><input name="postal_prefix" placeholder="Prefix, e.g. 41" required size="10"><select name="territory">${tOpts}</select><button class="btn">Add geo rule</button></form>`}</section>
      <section><h2>Manual assignments</h2><table><tr><th>Account</th><th>Action</th><th>Territory</th><th>Note</th><th></th></tr>
        ${rules.manual.map(r => `<tr><td>${esc(r.account)}</td><td>${esc(r.action)}</td><td><span class="tag">${esc(r.territory)}</span></td><td class="muted">${esc(r.note)}</td><td>${del("manual", r.id)}</td></tr>`).join("")}</table>
        ${readonly() ? "" : `<form class="row" id="fMan"><input name="account" placeholder="Account id" required size="10"><select name="action"><option>include</option><option>exclude</option></select>
          <select name="territory">${tOpts}</select><input name="note" placeholder="Note"><button class="btn">Add</button></form>`}</section>`;
    const base = `/api/scenarios/${state.sid}/rules`;
    $("#view").onclick = async e => { const { kind, id } = e.target.dataset; if (kind) { await api(`${base}/${kind}/${id}`, "DELETE"); render(); } };
    const on = (id, fn) => { const f = $(id); if (f) f.onsubmit = async e => { e.preventDefault(); await fn(formData(f)); render(); }; };
    on("#fAcct", d => {
      const value = ["in", "not_in"].includes(d.op) ? d.value.split("|").map(s => s.trim()) : (["gte", "lte"].includes(d.op) ? +d.value : d.value);
      return api(`${base}/account`, "POST", { name: d.name, territory: d.territory, priority: +d.priority, conditions: [{ field: d.field, op: d.op, value }] });
    });
    on("#fGeo", d => api(`${base}/geo`, "POST", d));
    on("#fMan", d => api(`${base}/manual`, "POST", d));
  },

  async scenarios() {
    const drafts = state.scenarios.filter(s => s.status === "draft");
    $("#view").innerHTML = `<section><h2>Scenarios</h2><p class="muted">A scenario is a copy of the alignment you can change freely. Compare it with master, then publish to make it live.</p>
      <table><tr><th>Name</th><th>Status</th><th>Created</th><th></th></tr>
      ${state.scenarios.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${s.status}</td><td class="muted">${esc(s.created_at)}</td><td>
        ${s.status === "draft" ? `<button class="btn ghost" data-diff="${s.id}">Compare</button> <button class="btn" data-pub="${s.id}">Publish</button> <button class="btn danger" data-del="${s.id}">Delete</button>` : ""}</td></tr>`).join("")}</table>
      <form class="row" id="fNew"><input name="name" placeholder="Scenario name" required><select name="base_id">${state.scenarios.map(s => `<option value="${s.id}">copy of ${esc(s.name)}</option>`).join("")}</select><button class="btn">Create scenario</button></form></section>
      <section id="diff"><h2>Compare with master</h2>${drafts.length ? "<p class='muted'>Pick Compare on a draft.</p>" : "<p class='muted'>Create a scenario first.</p>"}</section>`;
    $("#fNew").onsubmit = async e => { e.preventDefault(); const s = await api("/api/scenarios", "POST", formData(e.target)); state.sid = s.id; await loadScenarios(); state.tab = "rules"; render(); toast(`Scenario created; now editing "${s.name}"`); };
    $("#view").onclick = async e => {
      const { diff, pub, del } = e.target.dataset;
      if (diff) {
        const ch = await api(`/api/diff?base=1&target=${diff}`);
        $("#diff").innerHTML = `<h2>Changes vs master (${ch.length})</h2>${ch.length ? `<table><tr><th>Account</th><th>Field force</th><th>Before</th><th>After</th></tr>
          ${ch.map(c => `<tr><td>${esc(c.account)}</td><td>${esc(c.field_force)}</td><td class="rem">${esc(c.before.join(", ") || "—")}</td><td class="add">${esc(c.after.join(", ") || "—")}</td></tr>`).join("")}</table>` : "<p class='muted'>No account moves.</p>"}`;
      }
      if (pub && confirm("Publish this scenario as the new master alignment?")) { const r = await api(`/api/scenarios/${pub}/publish`, "POST", {}); state.sid = 1; await loadScenarios(); render(); toast(`Published: ${r.changes.length} account moves`); }
      if (del && confirm("Delete this scenario?")) { await api(`/api/scenarios/${del}`, "DELETE"); await loadScenarios(); render(); }
    };
  },

  async feedback() {
    const [items, terr] = await Promise.all([api("/api/feedback"), api("/api/scenarios/1/territories")]);
    $("#view").innerHTML = `<section><h2>Request a change</h2><p class="muted">Reps ask to add or drop an account. Approved requests become manual assignments on master.</p>
      <form class="row" id="fFb"><input name="requested_by" placeholder="Your name" required><select name="action"><option>add</option><option>drop</option></select>
        <input name="account" placeholder="Account id" required size="10"><select name="territory">${terr.map(t => `<option>${esc(t.code)}</option>`).join("")}</select>
        <input name="comment" placeholder="Reason"><button class="btn">Submit</button></form></section>
      <section><h2>Requests</h2><table><tr><th>#</th><th>Request</th><th>By</th><th>Reason</th><th>Status</th><th></th></tr>
        ${items.map(f => `<tr><td>${f.id}</td><td>${esc(f.action)} <b>${esc(f.account)}</b> ${f.action === "add" ? "to" : "from"} <span class="tag">${esc(f.territory)}</span></td>
        <td>${esc(f.requested_by)}</td><td class="muted">${esc(f.comment)}</td><td>${f.status}${f.resolved_by ? ` <span class="muted">by ${esc(f.resolved_by)}</span>` : ""}</td>
        <td>${f.status === "pending" ? `<button class="btn" data-ok="${f.id}">Approve</button> <button class="btn danger" data-no="${f.id}">Reject</button>` : ""}</td></tr>`).join("") || "<tr><td colspan=6 class='muted'>No requests yet.</td></tr>"}</table></section>`;
    $("#fFb").onsubmit = async e => { e.preventDefault(); await api("/api/feedback", "POST", formData(e.target)); render(); };
    $("#view").onclick = async e => { const { ok, no } = e.target.dataset; const id = ok || no; if (id) { await api(`/api/feedback/${id}/${ok ? "approve" : "reject"}`, "POST", { resolved_by: "manager" }); render(); } };
  },
};
init();
</script>
</body>
</html>
