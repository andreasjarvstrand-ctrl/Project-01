<script>
// ---- engine.js ----
/* Territory Manager alignment engine. Pure functions, no DOM, no storage.
 *
 * Precedence per field force, per account:
 *  1. Eligibility: the field force's targeting conditions must match
 *     (otherwise only manual includes apply).
 *  2. Manual include: always applies.
 *  3. Account rules: every matching rule at the best (lowest) priority assigns;
 *     if any matches, geography is skipped.
 *  4. Geo rules: longest matching postal-code prefix wins; ties share the account.
 *  5. Manual exclude: removes a territory, whatever assigned it.
 */
var TMEngine = (function () {
  "use strict";

  const OPS = ["eq", "ne", "in", "not_in", "starts_with", "contains", "gte", "lte"];

  const norm = v => (typeof v === "string" ? v.trim().toLowerCase() : v == null ? null : v);
  const normPostal = v => String(v ?? "").replace(/\s+/g, "").toUpperCase();

  function validateCondition(c) {
    if (!c || typeof c.field !== "string" || !c.field.trim()) throw new Error("condition needs a field");
    if (!OPS.includes(c.op)) throw new Error(`unknown operator "${c.op}"; use one of ${OPS.join(", ")}`);
    if ((c.op === "in" || c.op === "not_in") && !Array.isArray(c.value)) throw new Error(`operator "${c.op}" needs a list of values`);
    if ((c.op === "gte" || c.op === "lte") && !Number.isFinite(Number(c.value))) throw new Error(`operator "${c.op}" needs a number`);
    return c;
  }

  function matches(c, account) {
    const actual = account[c.field];
    const expected = c.value;
    switch (c.op) {
      case "eq": return norm(actual) === norm(expected);
      case "ne": return norm(actual) !== norm(expected);
      case "in": return expected.map(norm).includes(norm(actual));
      case "not_in": return !expected.map(norm).includes(norm(actual));
    }
    if (actual == null || actual === "") return false;
    if (c.op === "starts_with") return String(actual).toLowerCase().startsWith(String(expected).toLowerCase());
    if (c.op === "contains") return String(actual).toLowerCase().includes(String(expected).toLowerCase());
    const a = Number(actual), e = Number(expected);
    if (!Number.isFinite(a) || !Number.isFinite(e)) return false;
    return c.op === "gte" ? a >= e : a <= e;
  }

  const allMatch = (conds, account) => (conds || []).every(c => matches(c, account));

  /**
   * @param {object} d
   *   fieldForces [{code, target:[cond]}], territories [{code, fieldForce, parent}],
   *   accounts [{id, postal_code, ...}], accountRules [{id, territory, priority, conditions, name}],
   *   geoRules [{id, territory, prefix}], manual [{id, account, territory, action, note}]
   * @returns [{account, fieldForce, territory, source, ruleId, detail}]
   */
  function runAlignment(d) {
    const terrFF = new Map(d.territories.map(t => [t.code, t.fieldForce]));

    const rulesByFF = new Map();
    for (const r of d.accountRules || []) {
      const ff = terrFF.get(r.territory);
      if (!ff) continue;
      if (!rulesByFF.has(ff)) rulesByFF.set(ff, []);
      rulesByFF.get(ff).push(r);
    }
    for (const list of rulesByFF.values()) list.sort((a, b) => a.priority - b.priority || a.id - b.id);

    const geoByFF = new Map();
    for (const g of d.geoRules || []) {
      const ff = terrFF.get(g.territory);
      if (!ff) continue;
      if (!geoByFF.has(ff)) geoByFF.set(ff, new Map());
      const m = geoByFF.get(ff), p = normPostal(g.prefix);
      if (!m.has(p)) m.set(p, []);
      m.get(p).push(g);
    }

    const includes = new Map(), excludes = new Set();
    for (const m of d.manual || []) {
      const ff = terrFF.get(m.territory);
      if (!ff) continue;
      if (m.action === "include") {
        const k = m.account + "\u0000" + ff;
        if (!includes.has(k)) includes.set(k, []);
        includes.get(k).push(m);
      } else if (m.action === "exclude") excludes.add(m.account + "\u0000" + m.territory);
    }

    const out = [];
    for (const acct of d.accounts) {
      const postal = normPostal(acct.postal_code);
      for (const ff of d.fieldForces) {
        const found = new Map();
        const add = (territory, source, ruleId, detail) => {
          if (!found.has(territory)) found.set(territory, { account: acct.id, fieldForce: ff.code, territory, source, ruleId, detail });
        };
        for (const m of includes.get(acct.id + "\u0000" + ff.code) || []) add(m.territory, "manual", m.id, m.note || "manual include");

        if (allMatch(ff.target, acct)) {
          let best = null;
          for (const r of rulesByFF.get(ff.code) || []) {
            if (best !== null && r.priority > best) break;
            if (allMatch(r.conditions, acct)) {
              best = r.priority;
              add(r.territory, "account_rule", r.id, r.name || `account rule #${r.id}`);
            }
          }
          if (best === null && postal) {
            const geo = geoByFF.get(ff.code);
            if (geo) {
              for (let n = postal.length; n > 0; n--) {
                const hits = geo.get(postal.slice(0, n));
                if (hits) { hits.forEach(g => add(g.territory, "geo_rule", g.id, `postal code starts ${postal.slice(0, n)}`)); break; }
              }
            }
          }
        }
        for (const [t, a] of found) if (!excludes.has(acct.id + "\u0000" + t)) out.push(a);
      }
    }
    return out;
  }

  /** Accounts whose territory set changed, per field force. */
  function diffAlignments(base, target) {
    const index = rows => {
      const m = new Map();
      for (const a of rows) {
        const k = a.account + "\u0000" + a.fieldForce;
        if (!m.has(k)) m.set(k, new Set());
        m.get(k).add(a.territory);
      }
      return m;
    };
    const b = index(base), t = index(target);
    const keys = [...new Set([...b.keys(), ...t.keys()])].sort();
    const changes = [];
    for (const k of keys) {
      const before = [...(b.get(k) || [])].sort(), after = [...(t.get(k) || [])].sort();
      if (before.join("|") !== after.join("|")) {
        const [account, fieldForce] = k.split("\u0000");
        changes.push({ account, fieldForce, before, after });
      }
    }
    return changes;
  }

  /** Account count and summed workload per territory, rolled up the hierarchy. */
  function territoryMetrics(territories, assignments, accounts, weightField = "potential") {
    const weight = new Map(accounts.map(a => [a.id, Number(a[weightField]) || 0]));
    const parent = new Map(territories.map(t => [t.code, t.parent || null]));
    const m = new Map(territories.map(t => [t.code, { accounts: new Set(), direct: 0 }]));
    for (const a of assignments) {
      if (m.has(a.territory)) m.get(a.territory).direct++;
      const seen = new Set();
      for (let node = a.territory; node && m.has(node) && !seen.has(node); node = parent.get(node)) {
        seen.add(node);
        m.get(node).accounts.add(a.account);
      }
    }
    const out = {};
    for (const [code, v] of m) {
      let w = 0;
      for (const id of v.accounts) w += weight.get(id) || 0;
      out[code] = { accounts: v.accounts.size, directAccounts: v.direct, workload: Math.round(w * 100) / 100 };
    }
    return out;
  }

  // ---- CSV (handles quotes, Excel BOM, comma or semicolon) ----
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, "");
    const firstLine = text.split(/\r?\n/, 1)[0];
    const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";
    const rows = [];
    let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (ch === '"') q = false;
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    const nonEmpty = rows.filter(r => r.some(c => c.trim() !== ""));
    if (!nonEmpty.length) return [];
    const header = nonEmpty[0].map(h => h.trim());
    return nonEmpty.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] ?? "").trim()]).filter(([h]) => h)));
  }

  function toCSV(header, rows) {
    const cell = v => {
      const s = String(v ?? "");
      return /[",;\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [header, ...rows].map(r => r.map(cell).join(",")).join("\r\n") + "\r\n";
  }

  return { OPS, validateCondition, matches, allMatch, runAlignment, diffAlignments, territoryMetrics, parseCSV, toCSV, normPostal };
})();



// ---- store.js ----
/* Territory Manager data model and operations. Works on a plain JSON-able object,
 * so the whole database can be saved to and opened from a single file. */
var TMStore = (function (E) {
  "use strict";

  const FORMAT = "territory-manager";
  const FORMAT_VERSION = 1;
  const MASTER = 1;
  const ACCOUNT_COLS = ["id", "name", "type", "specialty", "segment", "postal_code", "city", "potential"];

  const now = () => new Date().toISOString().slice(0, 19) + "Z";
  const fail = msg => { throw new Error(msg); };
  const emptyScope = () => ({ territories: [], accountRules: [], geoRules: [], manual: [] });
  const clone = o => JSON.parse(JSON.stringify(o));

  function create() {
    return {
      format: FORMAT, version: FORMAT_VERSION, nextId: 2,
      fieldForces: [], accounts: [], roster: [], feedback: [],
      scenarios: [{ id: MASTER, name: "Master", status: "master", baseId: null, createdAt: now(), ...emptyScope() }],
    };
  }

  /** Validate a loaded file and fill in anything missing. */
  function load(obj) {
    if (!obj || obj.format !== FORMAT) fail("This is not a Territory Manager data file.");
    if (obj.version > FORMAT_VERSION) fail("This file was made by a newer version of Territory Manager.");
    const s = { ...create(), ...obj };
    if (!s.scenarios.some(x => x.id === MASTER)) fail("The data file has no master alignment.");
    let max = 1;
    const seeIds = list => list.forEach(x => { if (typeof x.id === "number") max = Math.max(max, x.id); });
    seeIds(s.scenarios); seeIds(s.roster); seeIds(s.feedback);
    for (const sc of s.scenarios) {
      Object.assign(sc, { ...emptyScope(), ...sc });
      seeIds(sc.accountRules); seeIds(sc.geoRules); seeIds(sc.manual);
    }
    s.nextId = Math.max(s.nextId || 0, max + 1);
    return s;
  }

  const newId = s => s.nextId++;

  // ---- reference data ----
  function upsertFieldForce(s, { code, name, target = [] }) {
    code = String(code || "").trim();
    if (!code || !String(name || "").trim()) fail("A field force needs a code and a name.");
    target.forEach(E.validateCondition);
    const ff = s.fieldForces.find(f => f.code === code);
    if (ff) Object.assign(ff, { name, target });
    else s.fieldForces.push({ code, name, target });
  }

  function deleteFieldForce(s, code) {
    if (s.scenarios.some(sc => sc.territories.some(t => t.fieldForce === code))) fail("Delete this field force's territories first.");
    s.fieldForces = s.fieldForces.filter(f => f.code !== code);
  }

  function cleanAccount(raw) {
    const id = String(raw.id ?? "").trim(), name = String(raw.name ?? "").trim();
    if (!id || !name) fail("Every account needs an id and a name.");
    const acct = {};
    for (const [k, v] of Object.entries(raw)) if (k) acct[k.trim()] = typeof v === "string" ? v.trim() : v;
    acct.id = id; acct.name = name;
    const p = String(acct.potential ?? "").replace(/\s/g, "").replace(",", ".");
    if (p === "") acct.potential = 0;
    else if (Number.isFinite(Number(p))) acct.potential = Number(p);
    else fail(`Account ${id}: potential "${acct.potential}" is not a number.`);
    return acct;
  }

  function upsertAccounts(s, rows) {
    const cleaned = rows.map(cleanAccount);  // validate all first: all or nothing
    const byId = new Map(s.accounts.map((a, i) => [a.id, i]));
    let added = 0, updated = 0;
    for (const a of cleaned) {
      if (byId.has(a.id)) { s.accounts[byId.get(a.id)] = { ...s.accounts[byId.get(a.id)], ...a }; updated++; }
      else { byId.set(a.id, s.accounts.length); s.accounts.push(a); added++; }
    }
    return { added, updated };
  }

  const importAccountsCSV = (s, text) => upsertAccounts(s, E.parseCSV(text));

  function deleteAccount(s, id) {
    s.accounts = s.accounts.filter(a => a.id !== id);
    s.scenarios.forEach(sc => { sc.manual = sc.manual.filter(m => m.account !== id); });
  }

  // ---- scenarios ----
  function scenario(s, id) {
    return s.scenarios.find(x => x.id === Number(id)) || fail(`Scenario ${id} not found.`);
  }

  function editable(s, id) {
    const sc = scenario(s, id);
    if (sc.status === "published") fail("Published scenarios are read-only.");
    return sc;
  }

  function createScenario(s, name, baseId = MASTER) {
    const base = scenario(s, baseId);
    const sc = { id: newId(s), name: String(name || "").trim() || "Untitled scenario", status: "draft", baseId: base.id, createdAt: now(), ...clone({
      territories: base.territories, accountRules: base.accountRules, geoRules: base.geoRules, manual: base.manual }) };
    s.scenarios.push(sc);
    return sc;
  }

  function deleteScenario(s, id) {
    if (Number(id) === MASTER) fail("The master alignment cannot be deleted.");
    scenario(s, id);
    s.scenarios = s.scenarios.filter(x => x.id !== Number(id));
  }

  function publishScenario(s, id) {
    if (Number(id) === MASTER) fail("Master is already live.");
    const sc = editable(s, id);
    const changes = diff(s, MASTER, sc.id);
    Object.assign(scenario(s, MASTER), clone({ territories: sc.territories, accountRules: sc.accountRules, geoRules: sc.geoRules, manual: sc.manual }));
    sc.status = "published";
    return changes;
  }

  // ---- territories & rules ----
  function territory(sc, code) {
    return sc.territories.find(t => t.code === code) || fail(`Territory "${code}" does not exist in scenario "${sc.name}".`);
  }

  function addTerritory(s, sid, { code, name, fieldForce, parent }) {
    const sc = editable(s, sid);
    code = String(code || "").trim(); name = String(name || "").trim();
    if (!code || !name) fail("A territory needs a code and a name.");
    if (!s.fieldForces.some(f => f.code === fieldForce)) fail(`Unknown field force "${fieldForce}".`);
    if (sc.territories.some(t => t.code === code)) fail(`Territory "${code}" already exists.`);
    if (parent && territory(sc, parent).fieldForce !== fieldForce) fail("The parent territory belongs to another field force.");
    sc.territories.push({ code, name, fieldForce, parent: parent || null });
  }

  function updateTerritory(s, sid, code, { name, parent }) {
    const sc = editable(s, sid), t = territory(sc, code);
    if (parent) {
      const p = territory(sc, parent);
      if (p.fieldForce !== t.fieldForce) fail("The parent territory belongs to another field force.");
      for (let n = p; n; n = n.parent ? territory(sc, n.parent) : null) if (n.code === code) fail("A territory cannot sit under itself.");
    }
    if (name !== undefined) t.name = String(name).trim() || t.name;
    if (parent !== undefined) t.parent = parent || null;
  }

  function deleteTerritory(s, sid, code) {
    const sc = editable(s, sid);
    territory(sc, code);
    if (sc.territories.some(t => t.parent === code)) fail("This territory has child territories. Move or delete them first.");
    sc.territories = sc.territories.filter(t => t.code !== code);
    for (const k of ["accountRules", "geoRules", "manual"]) sc[k] = sc[k].filter(r => r.territory !== code);
    if (sc.id === MASTER) s.roster = s.roster.filter(r => r.territory !== code);
  }

  function addAccountRule(s, sid, { territory: code, conditions, priority = 100, name = "" }) {
    const sc = editable(s, sid);
    territory(sc, code);
    if (!conditions || !conditions.length) fail("An account rule needs at least one condition.");
    conditions.forEach(E.validateCondition);
    const r = { id: newId(s), territory: code, name, priority: Number(priority) || 0, conditions };
    sc.accountRules.push(r);
    return r.id;
  }

  function addGeoRule(s, sid, { territory: code, prefix }) {
    const sc = editable(s, sid);
    territory(sc, code);
    prefix = E.normPostal(prefix);
    if (!prefix) fail("A postal-code prefix is required.");
    const r = { id: newId(s), territory: code, prefix };
    sc.geoRules.push(r);
    return r.id;
  }

  function addManual(s, sid, { account, territory: code, action, note = "" }) {
    const sc = editable(s, sid);
    territory(sc, code);
    if (action !== "include" && action !== "exclude") fail("Action must be include or exclude.");
    if (!s.accounts.some(a => a.id === account)) fail(`Unknown account "${account}".`);
    sc.manual = sc.manual.filter(m => !(m.account === account && m.territory === code));
    const r = { id: newId(s), account, territory: code, action, note };
    sc.manual.push(r);
    return r.id;
  }

  function deleteRule(s, sid, kind, id) {
    const key = { account: "accountRules", geo: "geoRules", manual: "manual" }[kind] || fail("Unknown rule type.");
    const sc = editable(s, sid), before = sc[key].length;
    sc[key] = sc[key].filter(r => r.id !== Number(id));
    if (sc[key].length === before) fail("Rule not found.");
  }

  // ---- alignment ----
  function align(s, sid) {
    const sc = scenario(s, sid);

          <p class="muted">Import a CSV from Excel with <b>File → Import accounts</b>. Columns: id, name, type, specialty, segment, postal_code, city, potential. Any extra column (e.g. tier) can be used in rules. Existing ids are updated.</p>
          <form class="row" id="fAcct"><input name="id" placeholder="Id" required size="8"><input name="name" placeholder="Name" required><input name="specialty" placeholder="Specialty">
          <input name="segment" placeholder="Segment" size="10"><input name="postal_code" placeholder="Postal code" size="9"><input name="city" placeholder="City" size="10">
          <input name="potential" placeholder="Potential" size="7"><button class="btn">Add account</button></form></section>`;
      const draw = () => {
        const term = $("#q").value.trim().toLowerCase();
        ui.accountQuery = $("#q").value;
        const by = new Map();
        for (const a of S.align(ui.data, ui.sid)) { if (!by.has(a.account)) by.set(a.account, []); by.get(a.account).push(a); }
        const rows = ui.data.accounts.filter(a => !term || (Object.values(a).join(" ") + " " + (by.get(a.id) || []).map(x => x.territory).join(" ")).toLowerCase().includes(term))
          .sort((a, b) => a.name.localeCompare(b.name));
        const shown = rows.slice(0, 500);
        $("#list").innerHTML = `<p class="muted">${rows.length} of ${ui.data.accounts.length} accounts${rows.length > shown.length ? " (first 500 shown; search to narrow)" : ""}</p>
          <table><tr><th>Account</th><th>Specialty</th><th>Segment</th><th>Postal code</th><th class="num">Potential</th><th>Territories and why</th><th></th></tr>
          ${shown.map(a => `<tr><td><b>${esc(a.name)}</b><br><span class="muted">${esc(a.id)} · ${esc(a.city)}</span></td><td>${esc(a.specialty)}</td><td>${esc(a.segment)}</td>
            <td>${esc(a.postal_code)}</td><td class="num">${esc(a.potential)}</td>
            <td>${(by.get(a.id) || []).map(x => `<span class="tag ${x.source === "manual" ? "src-manual" : ""}">${esc(x.territory)}</span> <span class="muted">${esc(x.detail)}</span>`).join("<br>") || "<span class='muted'>not aligned</span>"}</td>
            <td><button class="btn danger small" data-a="delAcct" data-id="${esc(a.id)}">Delete</button></td></tr>`).join("")}</table>`;
      };
      let timer; $("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(draw, 150); };
      on({ delAcct: ({ id }) => confirm(`Delete account ${id}?`) && act(x => S.deleteAccount(x, id)) },
         { fAcct: v => act(x => S.upsertAccounts(x, [v]), r => toast(r.added ? "Account added." : "Account updated.")) });
      draw();
    },

    rules() {
      const sc = S.scenario(ui.data, ui.sid), t = terrOptions();
      const noTerr = !sc.territories.length;
      $("#view").innerHTML = `
      <section><h2>How an account gets its territory</h2><ol class="muted" style="margin:0;padding-left:20px">
        <li>It must fit the field force (${ui.data.fieldForces.map(f => `${esc(f.code)}: ${f.target.map(condText).join(" and ") || "all accounts"}`).join("; ") || "no field forces yet"}).</li>
        <li>Manual includes always apply.</li>
        <li>Account rules: every match at the best (lowest) priority number assigns, and geography is then skipped.</li>
        <li>Geography rules: the longest matching postal-code start wins.</li>
        <li>Manual excludes remove a territory.</li></ol>
        ${noTerr ? `<p class="rem">Add territories on the Territories tab before creating rules.</p>` : ""}</section>
      <section><h2>Account rules</h2><table><tr><th class="num">Priority</th><th>Name</th><th>Conditions (all must match)</th><th>Territory</th><th></th></tr>
        ${[...sc.accountRules].sort((a, b) => a.priority - b.priority || a.id - b.id).map(r => `<tr><td class="num">${r.priority}</td><td>${esc(r.name)}</td><td>${r.conditions.map(condText).join("<br>")}</td>
          <td><span class="tag">${esc(r.territory)}</span></td><td>${del("delRule", `data-kind="account" data-id="${r.id}"`)}</td></tr>`).join("") || "<tr><td colspan=5 class='muted'>None.</td></tr>"}</table>
        ${readonly() || noTerr ? "" : `<form class="row" id="fRule"><input name="name" placeholder="Rule name"><input name="field" placeholder="Field, e.g. segment" required size="12">
          <select name="op">${opOptions()}</select><input name="value" placeholder="Value (| between options)" required>
          <input name="field2" placeholder="and field (optional)" size="12"><select name="op2">${opOptions()}</select><input name="value2" placeholder="value">
          <label class="muted">priority <input name="priority" type="number" value="100" style="width:70px"></label><select name="territory">${t}</select><button class="btn">Add rule</button></form>`}</section>
      <section><h2>Geography rules</h2><table><tr><th>Postal code starts with</th><th>Territory</th><th></th></tr>
        ${[...sc.geoRules].sort((a, b) => a.prefix.localeCompare(b.prefix)).map(r => `<tr><td>${esc(r.prefix)}</td><td><span class="tag">${esc(r.territory)}</span></td><td>${del("delRule", `data-kind="geo" data-id="${r.id}"`)}</td></tr>`).join("") || "<tr><td colspan=3 class='muted'>None.</td></tr>"}</table>
        ${readonly() || noTerr ? "" : `<form class="row" id="fGeo"><input name="prefix" placeholder="e.g. 41 or 113,114,115" required size="16"><select name="territory">${t}</select><button class="btn">Add</button></form>
          <p class="muted">Tip: enter several prefixes separated by commas.</p>`}</section>
      <section><h2>Manual assignments</h2><table><tr><th>Account</th><th>Action</th><th>Territory</th><th>Note</th><th></th></tr>
        ${sc.manual.map(r => `<tr><td>${esc(r.account)} <span class="muted">${esc(ui.data.accounts.find(a => a.id === r.account)?.name)}</span></td><td>${esc(r.action)}</td><td><span class="tag">${esc(r.territory)}</span></td>
          <td class="muted">${esc(r.note)}</td><td>${del("delRule", `data-kind="manual" data-id="${r.id}"`)}</td></tr>`).join("") || "<tr><td colspan=5 class='muted'>None.</td></tr>"}</table>
        ${readonly() || noTerr ? "" : `<form class="row" id="fMan"><input name="account" placeholder="Account id" required size="10" list="acctIds"><datalist id="acctIds">${ui.data.accounts.slice(0, 2000).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</datalist>
          <select name="action"><option>include</option><option>exclude</option></select><select name="territory">${t}</select><input name="note" placeholder="Note"><button class="btn">Add</button></form>`}</section>`;

      on({ delRule: ({ kind, id }) => act(x => S.deleteRule(x, ui.sid, kind, id)) }, {
        fRule: v => act(x => {
          const conditions = [{ field: v.field.trim(), op: v.op, value: parseValue(v.op, v.value) }];
          if (v.field2.trim()) conditions.push({ field: v.field2.trim(), op: v.op2, value: parseValue(v.op2, v.value2) });
          return S.addAccountRule(x, ui.sid, { name: v.name, territory: v.territory, priority: Number(v.priority), conditions });
        }),
        fGeo: v => act(x => v.prefix.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(prefix => S.addGeoRule(x, ui.sid, { territory: v.territory, prefix }))),
        fMan: v => act(x => S.addManual(x, ui.sid, v)),
      });
    },

    scenarios() {
      const d = ui.data;
      $("#view").innerHTML = `<section><h2>Scenarios</h2>
        <p class="muted">A scenario is a copy of the alignment you can change freely. Compare it with master, then publish to make it the live alignment.</p>
        <table><tr><th>Name</th><th>Status</th><th>Created</th><th></th></tr>
        ${d.scenarios.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${s.status}</td><td class="muted">${esc(s.createdAt.slice(0, 16).replace("T", " "))}</td><td>
          ${s.status === "draft" ? `<button class="btn ghost small" data-a="edit" data-id="${s.id}">Edit</button> <button class="btn ghost small" data-a="diff" data-id="${s.id}">Compare</button>
          <button class="btn small" data-a="publish" data-id="${s.id}">Publish</button> <button class="btn danger small" data-a="del" data-id="${s.id}">Delete</button>` : ""}</td></tr>`).join("")}</table>
        <form class="row" id="fScen"><input name="name" placeholder="Scenario name, e.g. 2027 realignment" required>
          <select name="baseId">${d.scenarios.map(s => `<option value="${s.id}">copy of ${esc(s.name)}</option>`).join("")}</select><button class="btn">Create scenario</button></form></section>
        <section id="diff"><h2>Compare with master</h2><p class="muted">Choose Compare on a draft scenario.</p></section>`;
      const showDiff = id => {
        const ch = S.diff(d, S.MASTER, id), names = new Map(d.accounts.map(a => [a.id, a.name]));
        $("#diff").innerHTML = `<h2>${esc(S.scenario(d, id).name)} vs master: ${ch.length} account${ch.length === 1 ? "" : "s"} move</h2>
          ${ch.length ? `<table><tr><th>Account</th><th>Field force</th><th>Now</th><th>In scenario</th></tr>
          ${ch.map(c => `<tr><td>${esc(c.account)} <span class="muted">${esc(names.get(c.account))}</span></td><td>${esc(c.fieldForce)}</td>
            <td class="rem">${esc(c.before.join(", ") || "—")}</td><td class="add">${esc(c.after.join(", ") || "—")}</td></tr>`).join("")}</table>` : "<p class='muted'>No account moves.</p>"}`;
      };
      on({
        edit: ({ id }) => { ui.sid = Number(id); ui.tab = "rules"; render(); },
        diff: ({ id }) => showDiff(Number(id)),
        publish: ({ id }) => confirm("Make this scenario the live (master) alignment?") &&
          act(x => S.publishScenario(x, id), ch => { ui.sid = S.MASTER; toast(`Published: ${ch.length} account moves.`); }),
        del: ({ id }) => confirm("Delete this scenario?") && act(x => S.deleteScenario(x, id)),
      }, {
        fScen: v => act(x => S.createScenario(x, v.name, Number(v.baseId)), sc => { ui.sid = sc.id; ui.tab = "rules"; toast(`Now editing "${sc.name}". Switch scenarios at the top right.`); }),
      });
    },

    feedback() {
      const d = ui.data, items = [...d.feedback].reverse();
      $("#view").innerHTML = `<section><h2>Request a change</h2>
        <p class="muted">Reps ask to add or drop an account in a live territory. Approving turns the request into a manual assignment on master.
        To collect requests from colleagues, they can make them in their copy and send you the data file, or simply email you the details.</p>
        ${S.scenario(d, S.MASTER).territories.length ? `<form class="row" id="fFb"><input name="requestedBy" placeholder="Your name" required>
          <select name="action"><option value="add">add</option><option value="drop">drop</option></select>
          <input name="account" placeholder="Account id" required size="10" list="acctIds2"><datalist id="acctIds2">${d.accounts.slice(0, 2000).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</datalist>
          <select name="territory">${terrOptions(S.MASTER)}</select><input name="comment" placeholder="Reason"><button class="btn">Submit</button></form>` : "<p class='muted'>Add territories first.</p>"}</section>
        <section><h2>Requests</h2><table><tr><th>#</th><th>Request</th><th>By</th><th>Reason</th><th>Status</th><th></th></tr>
        ${items.map(f => `<tr><td>${f.id}</td><td>${f.action} <b>${esc(f.account)}</b> ${f.action === "add" ? "to" : "from"} <span class="tag">${esc(f.territory)}</span></td>
          <td>${esc(f.requestedBy)}</td><td class="muted">${esc(f.comment)}</td><td>${f.status}${f.resolvedBy ? ` <span class="muted">by ${esc(f.resolvedBy)}</span>` : ""}</td>
          <td>${f.status === "pending" ? `<button class="btn small" data-a="ok" data-id="${f.id}">Approve</button> <button class="btn danger small" data-a="no" data-id="${f.id}">Reject</button>` : ""}</td></tr>`).join("")
          || "<tr><td colspan=6 class='muted'>No requests yet.</td></tr>"}</table></section>`;
      on({
        ok: ({ id }) => act(x => S.resolveFeedback(x, id, true)),
        no: ({ id }) => act(x => S.resolveFeedback(x, id, false)),
      }, { fFb: v => act(x => S.submitFeedback(x, v), () => toast("Request submitted.")) });
    },
  };

  // ---------- start ----------
  function start() {
    $("#tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}">${v}</button>`).join("");
    $("#tabs").onclick = e => { const k = e.target.dataset.tab; if (k) { ui.tab = k; try { localStorage.setItem(LS_KEY + ".tab", k); } catch {} render(); } };
    $("#scenario").onchange = e => { ui.sid = Number(e.target.value); render(); };
    $("#menuItems").innerHTML = MENU.map(m => m === "-" ? "<hr>" : `<button data-m="${m[0]}">${m[1]}</button>`).join("");
    $("#menuBtn").onclick = e => { e.stopPropagation(); $("#menuBox").classList.toggle("open"); };
    $("#menuItems").onclick = e => { const m = e.target.dataset.m; if (m) { $("#menuBox").classList.remove("open"); MENU_ACTIONS[m](); } };
    document.addEventListener("click", () => $("#menuBox").classList.remove("open"));
    document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && ui.data) { e.preventDefault(); save(); } });
    window.addEventListener("beforeunload", e => { if (ui.data && ui.dirty && !ui.fileHandle && !persistLocal()) { e.preventDefault(); e.returnValue = ""; } });

    try { ui.tab = localStorage.getItem(LS_KEY + ".tab") || ui.tab; } catch {}
    if (!TABS[ui.tab]) ui.tab = "territories";
    try {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) { ui.data = S.load(JSON.parse(saved)); ui.dirty = true; }
    } catch (err) { toast("Could not read the data kept in this browser: " + err.message, true); }
    renderShell();
  }

  start();
})(TMEngine, TMStore, TMDemo);

</script>
</body>
</html>
