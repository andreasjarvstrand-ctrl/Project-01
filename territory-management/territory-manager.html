* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

<script>
// ---- engine.js ----
/* Territory Manager alignment engine. Pure functions, no DOM, no storage.
 *
 * Precedence per field force, per account:
 *  1. Eligibility: the field force's targeting conditions must match
 *     (otherwise only manual includes apply).
 *  2. Manual include: always applies.
 *  3. Account rules: every matching rule at the best (lowest) priority assigns;
 *     if any matches, geography is skipped.
 *  4. Geo rules: a brick rule matching account.brick, otherwise the longest matching
 *     postal-code prefix; ties share the account.
 *  5. Manual exclude: removes a territory, whatever assigned it.
 */
var TMEngine = (function () {
  "use strict";

  const OPS = ["eq", "ne", "in", "not_in", "starts_with", "contains", "gte", "lte"];

  const norm = v => (typeof v === "string" ? v.trim().toLowerCase() : v == null ? null : v);
  const normPostal = v => String(v ?? "").replace(/\s+/g, "").toUpperCase();

  function validateCondition(c) {
    if (!c || typeof c.field !== "string" || !c.field.trim()) throw new Error("condition needs a field");
    if (!OPS.includes(c.op)) throw new Error(`unknown operator "${c.op}"; use one of ${OPS.join(", ")}`);
    if ((c.op === "in" || c.op === "not_in") && !Array.isArray(c.value)) throw new Error(`operator "${c.op}" needs a list of values`);
    if ((c.op === "gte" || c.op === "lte") && !Number.isFinite(Number(c.value))) throw new Error(`operator "${c.op}" needs a number`);
    return c;
  }

  function matches(c, account) {
    const actual = account[c.field];
    const expected = c.value;
    switch (c.op) {
      case "eq": return norm(actual) === norm(expected);
      case "ne": return norm(actual) !== norm(expected);
      case "in": return expected.map(norm).includes(norm(actual));
      case "not_in": return !expected.map(norm).includes(norm(actual));
    }
    if (actual == null || actual === "") return false;
    if (c.op === "starts_with") return String(actual).toLowerCase().startsWith(String(expected).toLowerCase());
    if (c.op === "contains") return String(actual).toLowerCase().includes(String(expected).toLowerCase());
    const a = Number(actual), e = Number(expected);
    if (!Number.isFinite(a) || !Number.isFinite(e)) return false;
    return c.op === "gte" ? a >= e : a <= e;
  }

  const allMatch = (conds, account) => (conds || []).every(c => matches(c, account));

  /**
   * @param {object} d
   *   fieldForces [{code, target:[cond]}], territories [{code, fieldForce, parent}],
   *   accounts [{id, postal_code, ...}], accountRules [{id, territory, priority, conditions, name}],
   *   geoRules [{id, territory, prefix}], manual [{id, account, territory, action, note}]
   * @returns [{account, fieldForce, territory, source, ruleId, detail}]
   */
  function runAlignment(d) {
    const terrFF = new Map(d.territories.map(t => [t.code, t.fieldForce]));

    const rulesByFF = new Map();
    for (const r of d.accountRules || []) {
      const ff = terrFF.get(r.territory);
      if (!ff) continue;
      if (!rulesByFF.has(ff)) rulesByFF.set(ff, []);
      rulesByFF.get(ff).push(r);
    }
    for (const list of rulesByFF.values()) list.sort((a, b) => a.priority - b.priority || a.id - b.id);

    // Postal rules match on the start of the postal code; brick rules match account.brick exactly.
    const geoByFF = new Map(), brickByFF = new Map();
    for (const g of d.geoRules || []) {
      const ff = terrFF.get(g.territory);
      if (!ff) continue;
      const target = g.kind === "brick" ? brickByFF : geoByFF;
      if (!target.has(ff)) target.set(ff, new Map());
      const m = target.get(ff), p = normPostal(g.prefix);
      if (!m.has(p)) m.set(p, []);
      m.get(p).push(g);
    }

    const includes = new Map(), excludes = new Set();
    for (const m of d.manual || []) {
      const ff = terrFF.get(m.territory);
      if (!ff) continue;
      if (m.action === "include") {
        const k = m.account + "\u0000" + ff;
        if (!includes.has(k)) includes.set(k, []);
        includes.get(k).push(m);
      } else if (m.action === "exclude") excludes.add(m.account + "\u0000" + m.territory);
    }

    const out = [];
    for (const acct of d.accounts) {
      const postal = normPostal(acct.postal_code);
      for (const ff of d.fieldForces) {
        const found = new Map();
        const add = (territory, source, ruleId, detail) => {
          if (!found.has(territory)) found.set(territory, { account: acct.id, fieldForce: ff.code, territory, source, ruleId, detail });
        };
        for (const m of includes.get(acct.id + "\u0000" + ff.code) || []) add(m.territory, "manual", m.id, m.note || "manual include");

        if (allMatch(ff.target, acct)) {
          let best = null;
          for (const r of rulesByFF.get(ff.code) || []) {
            if (best !== null && r.priority > best) break;
            if (allMatch(r.conditions, acct)) {
              best = r.priority;
              add(r.territory, "account_rule", r.id, r.name || `account rule #${r.id}`);
            }
          }
          let geoHit = false;
          if (best === null && acct.brick != null && acct.brick !== "") {
            const hits = brickByFF.get(ff.code)?.get(normPostal(acct.brick));
            if (hits) { geoHit = true; hits.forEach(g => add(g.territory, "geo_rule", g.id, `brick ${normPostal(acct.brick)}`)); }
          }
          if (best === null && !geoHit && postal) {
            const geo = geoByFF.get(ff.code);
            if (geo) {
              for (let n = postal.length; n > 0; n--) {
                const hits = geo.get(postal.slice(0, n));
                if (hits) { hits.forEach(g => add(g.territory, "geo_rule", g.id, `postal code starts ${postal.slice(0, n)}`)); break; }
              }
            }
          }
        }
        for (const [t, a] of found) if (!excludes.has(acct.id + "\u0000" + t)) out.push(a);
      }
    }
    return out;
  }

  /** Accounts whose territory set changed, per field force. */
  function diffAlignments(base, target) {
    const index = rows => {
      const m = new Map();
      for (const a of rows) {
        const k = a.account + "\u0000" + a.fieldForce;
        if (!m.has(k)) m.set(k, new Set());
        m.get(k).add(a.territory);
      }
      return m;
    };
    const b = index(base), t = index(target);
    const keys = [...new Set([...b.keys(), ...t.keys()])].sort();
    const changes = [];
    for (const k of keys) {
      const before = [...(b.get(k) || [])].sort(), after = [...(t.get(k) || [])].sort();
      if (before.join("|") !== after.join("|")) {
        const [account, fieldForce] = k.split("\u0000");
        changes.push({ account, fieldForce, before, after });
      }
    }
    return changes;
  }

  /** Account count and summed workload per territory, rolled up the hierarchy. */
  function territoryMetrics(territories, assignments, accounts, weightField = "potential") {
    const weight = new Map(accounts.map(a => [a.id, Number(a[weightField]) || 0]));
    const parent = new Map(territories.map(t => [t.code, t.parent || null]));
    const m = new Map(territories.map(t => [t.code, { accounts: new Set(), direct: 0 }]));
    for (const a of assignments) {
      if (m.has(a.territory)) m.get(a.territory).direct++;
      const seen = new Set();
      for (let node = a.territory; node && m.has(node) && !seen.has(node); node = parent.get(node)) {
        seen.add(node);
        m.get(node).accounts.add(a.account);
      }
    }
    const out = {};
    for (const [code, v] of m) {
      let w = 0;
      for (const id of v.accounts) w += weight.get(id) || 0;
      out[code] = { accounts: v.accounts.size, directAccounts: v.direct, workload: Math.round(w * 100) / 100 };
    }
    return out;
  }

  // ---- CSV (handles quotes, Excel BOM, comma or semicolon) ----
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, "");
    const firstLine = text.split(/\r?\n/, 1)[0];
    const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";
    const rows = [];
    let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (ch === '"') q = false;
        else field += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += ch;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    const nonEmpty = rows.filter(r => r.some(c => c.trim() !== ""));
    if (!nonEmpty.length) return [];
    const header = nonEmpty[0].map(h => h.trim());
    return nonEmpty.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] ?? "").trim()]).filter(([h]) => h)));
  }

  function toCSV(header, rows) {
    const cell = v => {
      const s = String(v ?? "");
      return /[",;\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [header, ...rows].map(r => r.map(cell).join(",")).join("\r\n") + "\r\n";
  }

  return { OPS, validateCondition, matches, allMatch, runAlignment, diffAlignments, territoryMetrics, parseCSV, toCSV, normPostal };
})();



// ---- store.js ----
/* Territory Manager data model and operations. Works on a plain JSON-able object,
 * so the whole database can be saved to and opened from a single file. */
var TMStore = (function (E) {
  "use strict";

  const FORMAT = "territory-manager";
  const FORMAT_VERSION = 1;
  const MASTER = 1;
  const ACCOUNT_COLS = ["id", "name", "type", "specialty", "segment", "postal_code", "city", "potential"];

  const now = () => new Date().toISOString().slice(0, 19) + "Z";
  const fail = msg => { throw new Error(msg); };
  const emptyScope = () => ({ territories: [], accountRules: [], geoRules: [], manual: [] });
  const clone = o => JSON.parse(JSON.stringify(o));

  function create() {
    return {
      format: FORMAT, version: FORMAT_VERSION, nextId: 2,
      fieldForces: [], accounts: [], roster: [], feedback: [],
      scenarios: [{ id: MASTER, name: "Master", status: "master", baseId: null, createdAt: now(), ...emptyScope() }],
    };
  }

  /** Validate a loaded file and fill in anything missing. */
  function load(obj) {
    if (!obj || obj.format !== FORMAT) fail("This is not a Territory Manager data file.");
    if (obj.version > FORMAT_VERSION) fail("This file was made by a newer version of Territory Manager.");
    const s = { ...create(), ...obj };
    if (!s.scenarios.some(x => x.id === MASTER)) fail("The data file has no master alignment.");
    let max = 1;
    const seeIds = list => list.forEach(x => { if (typeof x.id === "number") max = Math.max(max, x.id); });
    seeIds(s.scenarios); seeIds(s.roster); seeIds(s.feedback);
    for (const sc of s.scenarios) {
      Object.assign(sc, { ...emptyScope(), ...sc });
      seeIds(sc.accountRules); seeIds(sc.geoRules); seeIds(sc.manual);
    }
    s.nextId = Math.max(s.nextId || 0, max + 1);
    return s;
  }

  const newId = s => s.nextId++;

  // ---- reference data ----
  function upsertFieldForce(s, { code, name, target = [] }) {
    code = String(code || "").trim();
    if (!code || !String(name || "").trim()) fail("A field force needs a code and a name.");
    target.forEach(E.validateCondition);
    const ff = s.fieldForces.find(f => f.code === code);
    if (ff) Object.assign(ff, { name, target });
    else s.fieldForces.push({ code, name, target });
  }

  function deleteFieldForce(s, code) {
    if (s.scenarios.some(sc => sc.territories.some(t => t.fieldForce === code))) fail("Delete this field force's territories first.");
    s.fieldForces = s.fieldForces.filter(f => f.code !== code);
  }

  function cleanAccount(raw) {
    const id = String(raw.id ?? "").trim(), name = String(raw.name ?? "").trim();
    if (!id || !name) fail("Every account needs an id and a name.");
    const acct = {};
    for (const [k, v] of Object.entries(raw)) if (k) acct[k.trim()] = typeof v === "string" ? v.trim() : v;
    acct.id = id; acct.name = name;
    const p = String(acct.potential ?? "").replace(/\s/g, "").replace(",", ".");
    if (p === "") acct.potential = 0;
    else if (Number.isFinite(Number(p))) acct.potential = Number(p);
    else fail(`Account ${id}: potential "${acct.potential}" is not a number.`);
    return acct;
  }

  function upsertAccounts(s, rows) {
    const cleaned = rows.map(cleanAccount);  // validate all first: all or nothing
    const byId = new Map(s.accounts.map((a, i) => [a.id, i]));
    let added = 0, updated = 0;
    for (const a of cleaned) {
      if (byId.has(a.id)) { s.accounts[byId.get(a.id)] = { ...s.accounts[byId.get(a.id)], ...a }; updated++; }
      else { byId.set(a.id, s.accounts.length); s.accounts.push(a); added++; }
    }
    return { added, updated };
  }

  const importAccountsCSV = (s, text) => upsertAccounts(s, E.parseCSV(text));

  function deleteAccount(s, id) {
    s.accounts = s.accounts.filter(a => a.id !== id);
    s.scenarios.forEach(sc => { sc.manual = sc.manual.filter(m => m.account !== id); });
  }

  // ---- scenarios ----
  function scenario(s, id) {
    return s.scenarios.find(x => x.id === Number(id)) || fail(`Scenario ${id} not found.`);
  }

  function editable(s, id) {
    const sc = scenario(s, id);
    if (sc.status === "published") fail("Published scenarios are read-only.");
    return sc;
  }

  function createScenario(s, name, baseId = MASTER) {
    const base = scenario(s, baseId);
    const sc = { id: newId(s), name: String(name || "").trim() || "Untitled scenario", status: "draft", baseId: base.id, createdAt: now(), ...clone({
      territories: base.territories, accountRules: base.accountRules, geoRules: base.geoRules, manual: base.manual }) };
    s.scenarios.push(sc);
    return sc;
  }

  function deleteScenario(s, id) {
    if (Number(id) === MASTER) fail("The master alignment cannot be deleted.");
    scenario(s, id);
    s.scenarios = s.scenarios.filter(x => x.id !== Number(id));
  }

  function publishScenario(s, id) {
    if (Number(id) === MASTER) fail("Master is already live.");
    const sc = editable(s, id);
    const changes = diff(s, MASTER, sc.id);
    Object.assign(scenario(s, MASTER), clone({ territories: sc.territories, accountRules: sc.accountRules, geoRules: sc.geoRules, manual: sc.manual }));
    sc.status = "published";
    return changes;
  }

  const PALETTE = ["#4e79a7", "#f28e2b", "#59a14f", "#e15759", "#76b7b2", "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#86bcb6", "#d37295", "#a0cbe8"];
  const NS = "http://www.w3.org/2000/svg";
  let cache = null;   // { geo, svg, paths: Map(code -> [path]), centroids, bounds, labels }
  let h = null;       // helpers from app.js for the current render

  const st = () => h.ui.map;
  const esc = s => h.esc(s);

  // ---------- geometry ----------
  function projector(geo) {
    let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
    for (const u of geo.units) for (const p of u.polygons) for (const [x, y] of p[0]) {
      if (x < minLon) minLon = x; if (x > maxLon) maxLon = x; if (y < minLat) minLat = y; if (y > maxLat) maxLat = y;
    }
    const k = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180) * 1000;
    const proj = ([lon, lat]) => [(lon - minLon) * k, (maxLat - lat) * 1000];
    return { proj, bounds: { x: 0, y: 0, w: (maxLon - minLon) * k || 1, h: (maxLat - minLat) * 1000 || 1 } };
  }

  function build(geo) {
    const { proj, bounds } = projector(geo);
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("id", "mapSvg");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Map of areas coloured by territory");
    const areas = document.createElementNS(NS, "g"), labels = document.createElementNS(NS, "g"), dots = document.createElementNS(NS, "g");
    areas.setAttribute("class", "areas"); labels.setAttribute("class", "labels"); dots.setAttribute("class", "dots");
    const box = document.createElementNS(NS, "rect");
    box.setAttribute("class", "selbox"); box.style.display = "none";
    const paths = new Map(), centroids = new Map();
    for (const u of geo.units) {
      let d = "", cx = 0, cy = 0, area = 0;
      for (const poly of u.polygons) for (const [ri, ring] of poly.entries()) {
        const pts = ring.map(proj);
        d += "M" + pts.map(([x, y]) => x.toFixed(1) + " " + y.toFixed(1)).join("L") + "Z";
        if (ri === 0) for (let i = 0, n = pts.length - 1; i < n; i++) {  // area-weighted centroid of outer rings
          const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], c = x0 * y1 - x1 * y0;
          area += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
        }
      }
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d); p.setAttribute("fill-rule", "evenodd"); p.dataset.code = u.code;
      areas.appendChild(p);
      paths.set(u.code, p);
      const fb = u.polygons[0][0].map(proj)[0];
      centroids.set(u.code, area ? [cx / (3 * area), cy / (3 * area)] : fb);
    }
    if (geo.units.length <= 400) for (const [code, [x, y]] of centroids) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", x); t.setAttribute("y", y); t.textContent = code;
      labels.appendChild(t);
    }
    svg.append(areas, dots, labels, box);
    cache = { geo, svg, paths, centroids, bounds, proj, labels, dots, box, names: new Map(geo.units.map(u => [u.code, u.name])) };
    attachEvents(svg);
    return cache;
  }

  // ---------- view box (pan & zoom) ----------
  function setViewBox(vb) {
    st().vb = vb;
    cache.svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const fs = vb.w / 70;
    cache.labels.setAttribute("font-size", fs.toFixed(2));
    cache.labels.style.display = vb.w / cache.bounds.w > 0.9 && cache.geo.units.length > 120 ? "none" : "";
    cache.dots.querySelectorAll("circle").forEach(c => c.setAttribute("r", (vb.w / 260 * Number(c.dataset.s)).toFixed(2)));
  }

  function fit() {
    const b = cache.bounds, pad = Math.max(b.w, b.h) * 0.03;
    const box = cache.svg.getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 0.8;
    let w = b.w + 2 * pad, hgt = b.h + 2 * pad;
    if (w / hgt < aspect) w = hgt * aspect; else hgt = w / aspect;
    setViewBox({ x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - hgt / 2, w, h: hgt });
  }

  function zoom(factor, cx, cy) {
    const vb = st().vb;
    if (cx === undefined) { cx = vb.x + vb.w / 2; cy = vb.y + vb.h / 2; }
    const w = Math.min(Math.max(vb.w * factor, cache.bounds.w / 400), cache.bounds.w * 4), f = w / vb.w;
    setViewBox({ x: cx - (cx - vb.x) * f, y: cy - (cy - vb.y) * f, w, h: vb.h * f });
  }

  function toSvg(evt) {
    const r = cache.svg.getBoundingClientRect(), vb = st().vb;
    // preserveAspectRatio "xMidYMid meet": work out the drawn scale and offset
    const s = Math.min(r.width / vb.w, r.height / vb.h);
    const ox = (r.width - vb.w * s) / 2, oy = (r.height - vb.h * s) / 2;
    return [vb.x + (evt.clientX - r.left - ox) / s, vb.y + (evt.clientY - r.top - oy) / s, s];
  }

  // ---------- interaction ----------
  function attachEvents(svg) {
    let drag = null;
    svg.addEventListener("wheel", e => {
      e.preventDefault();
      const [x, y] = toSvg(e);
      zoom(e.deltaY > 0 ? 1.2 : 1 / 1.2, x, y);
    }, { passive: false });
    svg.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      const [x, y, s] = toSvg(e);
      drag = { x0: e.clientX, y0: e.clientY, sx: x, sy: y, s, vb: { ...st().vb }, box: e.shiftKey, moved: false };
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener("pointermove", e => {
      if (!drag) return hover(e);
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true;
      hideTip();
      if (drag.box) {
        const [x, y] = toSvg(e), b = cache.box;
        b.style.display = "";
        b.setAttribute("x", Math.min(x, drag.sx)); b.setAttribute("y", Math.min(y, drag.sy));
        b.setAttribute("width", Math.abs(x - drag.sx)); b.setAttribute("height", Math.abs(y - drag.sy));
      } else {
        setViewBox({ ...drag.vb, x: drag.vb.x - dx / drag.s, y: drag.vb.y - dy / drag.s });
      }
    });
    const end = e => {
      if (!drag) return;
      const d = drag; drag = null;
      if (d.box && d.moved) {
        cache.box.style.display = "none";
        const [x, y] = toSvg(e), x0 = Math.min(x, d.sx), x1 = Math.max(x, d.sx), y0 = Math.min(y, d.sy), y1 = Math.max(y, d.sy);
        let n = 0;
        for (const [code, [cx, cy]] of cache.centroids) if (cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1) { st().selected.add(code); n++; }
        h.rerender();
        if (!n) h.toast("No area centres inside that box.");
      } else if (!d.moved) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const code = el && el.dataset && el.dataset.code;
        if (code) clickArea(code, e);
      }
    };
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", () => { drag = null; cache.box.style.display = "none"; });
    svg.addEventListener("pointerleave", hideTip);
  }

  function clickArea(code, e) {
    const m = st();
    if (m.paint && m.target && !h.readonly()) {
      h.act(d => S.assignAreas(d, h.ui.sid, m.ff, [code], m.target === "__none__" ? null : m.target));
      return;
    }
    // Ctrl/Shift+click adds to the selection; on touch screens every tap does.
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.pointerType === "touch") { m.selected.has(code) ? m.selected.delete(code) : m.selected.add(code); }
    else if (m.selected.size === 1 && m.selected.has(code)) m.selected.clear();
    else { m.selected.clear(); m.selected.add(code); }
    h.rerender();
  }

  function hover(e) {
    const tip = document.getElementById("mapTip");
    const code = e.target && e.target.dataset && e.target.dataset.code;
    if (!tip || !code || !h.status) return hideTip();
    const a = h.status.get(code), name = cache.names.get(code);
    const terr = a.territories.length ? a.territories.map(t => `<b>${esc(t)}</b>`).join(", ") + (a.own ? "" : ` <span class="muted">(via rule ${esc(a.via)})</span>`) : "<i>unassigned</i>";
    tip.innerHTML = `<b>${esc(code)}</b> ${esc(name)}<br>${terr}<br>${a.eligible} account${a.eligible === 1 ? "" : "s"} in this field force · workload ${round(a.workload)}`
      + (a.partial.length ? `<br><span class="muted">Parts assigned elsewhere: ${a.partial.map(p => esc(p.prefix) + "→" + esc(p.territories.join("/"))).join(", ")}</span>` : "");
    const box = tip.parentElement.getBoundingClientRect();
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX - box.left + 14, box.width - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.min(e.clientY - box.top + 14, box.height - tip.offsetHeight - 4) + "px";
  }
  function hideTip() { const t = document.getElementById("mapTip"); if (t) t.style.display = "none"; }
  const round = n => Math.round(n * 10) / 10;

  // ---------- colours ----------
  function colours(sc, ff) {
    const m = new Map();
    sc.territories.filter(t => t.fieldForce === ff).forEach((t, i) => m.set(t.code, PALETTE[i % PALETTE.length]));
    return m;
  }

  function paint(sc) {
    const m = st(), col = colours(sc, m.ff);
    for (const [code, els] of [...cache.paths].map(([c, p]) => [c, [p]])) {
      const a = h.status.get(code);
      const p = els[0];
      p.setAttribute("fill", a.territories.length ? col.get(a.territories[0]) : "var(--unassigned)");
      p.setAttribute("fill-opacity", a.territories.length ? (a.own ? "0.9" : "0.55") : "1");
      p.classList.toggle("sel", m.selected.has(code));
      p.classList.toggle("shared", a.territories.length > 1);
    }
    // keep selected outlines on top
    const g = cache.svg.querySelector(".areas");
    for (const code of m.selected) { const p = cache.paths.get(code); if (p) g.appendChild(p); }
    // account dots
    cache.dots.textContent = "";
    if (m.dots) {
      const ff = h.data.fieldForces.find(f => f.code === m.ff), by = new Map();
      for (const a of S.align(h.data, h.ui.sid)) if (a.fieldForce === m.ff) by.set(a.account, a.territory);
      const vbw = (m.vb || cache.bounds).w;
      for (const a of h.data.accounts) {
        const lon = Number(a.lon ?? a.longitude), lat = Number(a.lat ?? a.latitude);
        if (!Number.isFinite(lon) || !Number.isFinite(lat) || (ff && !E.allMatch(ff.target, a))) continue;
        const [x, y] = cache.proj([lon, lat]), c = document.createElementNS(NS, "circle");
        const s = 0.8 + Math.min(1.6, Math.sqrt(Number(a.potential) || 0) / 6);
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.dataset.s = s.toFixed(2);
        c.setAttribute("r", (vbw / 260 * s).toFixed(2));
        c.setAttribute("fill", by.has(a.id) ? col.get(by.get(a.id)) || "#555" : "#fff");
        const title = document.createElementNS(NS, "title");
        title.textContent = `${a.name} (${a.id})${by.has(a.id) ? " → " + by.get(a.id) : " · not aligned"}`;
        c.appendChild(title);
        cache.dots.appendChild(c);
      }
    }
    return col;
  }

  // ---------- render ----------
  function render(helpers) {
    h = helpers;
    const d = h.data, view = h.view;
    const m = (h.ui.map ||= { ff: null, target: "", selected: new Set(), paint: false, dots: true, vb: null });
    if (!d.geo) return renderEmpty(view);
    if (!d.fieldForces.length) {
      view.innerHTML = `<section><h2>Map</h2><p class="muted">Add a field force and its territories on the Territories tab first.</p></section>${areasSection()}`;
      return bindAreas();
    }
    if (!d.fieldForces.some(f => f.code === m.ff)) m.ff = d.fieldForces[0].code;
    const sc = S.scenario(d, h.ui.sid);
    const terrs = sc.territories.filter(t => t.fieldForce === m.ff);
    if (m.target && m.target !== "__none__" && !terrs.some(t => t.code === m.target)) m.target = "";
    for (const c of [...m.selected]) if (!d.geo.units.some(u => u.code === c)) m.selected.delete(c);
    h.status = S.areaStatus(d, h.ui.sid, m.ff);
    const summary = new Map(S.territorySummary(d, h.ui.sid).map(t => [t.code, t]));
    const kindWord = d.geo.kind === "brick" ? "brick" : "postal area";
    const ro = h.readonly();

    let selAcc = 0, selWork = 0;
    for (const c of m.selected) { const a = h.status.get(c); if (a) { selAcc += a.eligible; selWork += a.workload; } }
    let unassigned = 0, unassignedAcc = 0;
    for (const a of h.status.values()) if (!a.territories.length) { unassigned++; unassignedAcc += a.eligible; }

    const col = colours(sc, m.ff);
    view.innerHTML = `
    <section class="mapsec">
      <div class="maptools">
        <label>Field force <select id="mFF">${d.fieldForces.map(f => `<option value="${esc(f.code)}" ${f.code === m.ff ? "selected" : ""}>${esc(f.code)}: ${esc(f.name)}</option>`).join("")}</select></label>
        <label>Assign to <select id="mTarget"><option value="">choose territory…</option>${terrs.map(t => `<option value="${esc(t.code)}" ${t.code === m.target ? "selected" : ""}>${esc(t.code)}</option>`).join("")}
          <option value="__none__" ${m.target === "__none__" ? "selected" : ""}>(remove area rule)</option></select></label>
        <label title="When on, clicking an area assigns it straight away"><input type="checkbox" id="mPaint" ${m.paint ? "checked" : ""} ${ro ? "disabled" : ""}> Paint mode</label>
        <label><input type="checkbox" id="mDots" ${m.dots ? "checked" : ""}> Accounts</label>
        <form id="mFind" class="inline"><input name="q" placeholder="Find ${kindWord} code" size="14"><button class="btn ghost small">Find</button></form>
      </div>
      <div class="mapgrid">
        <div class="mapbox" id="mapBox">
          <div class="zoombtns"><button class="btn ghost small" data-z="in" title="Zoom in">+</button><button class="btn ghost small" data-z="out" title="Zoom out">−</button><button class="btn ghost small" data-z="fit" title="Show everything">Fit</button></div>
          <div id="mapTip" class="maptip"></div>
        </div>
        <aside class="legend">
          <div class="selpanel">
            ${m.selected.size ? `<b>${m.selected.size} ${kindWord}${m.selected.size === 1 ? "" : "s"} selected</b>
              <div class="muted codes">${[...m.selected].slice(0, 40).map(esc).join(", ")}${m.selected.size > 40 ? "…" : ""}</div>
              <div>${selAcc} accounts · workload ${round(selWork)}</div>
              ${ro ? "" : `<div class="row2"><button class="btn small" id="mAssign" ${m.target ? "" : "disabled"}>${m.target === "__none__" ? "Remove area rule" : m.target ? "Assign to " + esc(m.target) : "Choose a territory above"}</button>
              <button class="btn ghost small" id="mClear">Clear selection</button></div>`}`
            : `<span class="muted">Click an area to select it. Ctrl+click adds more. Shift+drag selects a box. Drag to move, scroll or +/− to zoom. On a touch screen, tap areas to add them.</span>`}
          </div>
          <table class="legtable"><tr><th></th><th>Territory</th><th class="num">Accts</th><th class="num">Work</th></tr>
            ${terrs.map(t => { const s = summary.get(t.code) || {}; return `<tr data-t="${esc(t.code)}" class="${t.code === m.target ? "on" : ""}" title="Click to assign to ${esc(t.code)}">
              <td><span class="sw" style="background:${col.get(t.code)}"></span></td><td>${esc(t.code)}<br><span class="muted">${esc(t.name)}</span></td>
              <td class="num">${s.accounts ?? 0}</td><td class="num">${round(s.workload ?? 0)}</td></tr>`; }).join("")}
            <tr><td><span class="sw" style="background:var(--unassigned)"></span></td><td>Unassigned<br><span class="muted">${unassigned} areas</span></td><td class="num">${unassignedAcc}</td><td></td></tr>
          </table>
          <p class="muted small">Solid colour: the area has its own rule. Lighter: covered by a broader rule (e.g. "1" covers 11, 14…). Assigning an area adds its own rule, which takes priority.</p>
        </aside>
      </div>
    </section>
    ${areasSection()}`;

    if (!cache || cache.geo !== d.geo) build(d.geo);
    $("#mapBox").prepend(cache.svg);
    paint(sc);
    if (m.vb && m.geoRef === d.geo) setViewBox(m.vb); else { m.geoRef = d.geo; requestAnimationFrame(fit); }

    $("#mFF").onchange = e => { m.ff = e.target.value; m.selected.clear(); m.target = ""; h.rerender(); };
    $("#mTarget").onchange = e => { m.target = e.target.value; h.rerender(); };
    $("#mPaint").onchange = e => { m.paint = e.target.checked; if (m.paint && !m.target) h.toast("Choose a territory in “Assign to”, then click areas."); };
    $("#mDots").onchange = e => { m.dots = e.target.checked; paint(sc); };
    $("#mFind").onsubmit = e => {
      e.preventDefault();
      const q = E.normPostal(new FormData(e.target).get("q"));
      const hits = d.geo.units.filter(u => u.code === q || (q && u.code.startsWith(q)) || (q.length > 1 && E.normPostal(u.name).includes(q)));
      if (!hits.length) return h.toast(`No ${kindWord} matches “${q}”.`, true);
      m.selected = new Set(hits.map(u => u.code));
      h.rerender();
      const pts = hits.map(u => cache.centroids.get(u.code)), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const w = Math.max(Math.max(...xs) - Math.min(...xs), cache.bounds.w / 12) * 1.6, ht = w * (m.vb.h / m.vb.w);
      setViewBox({ x: (Math.max(...xs) + Math.min(...xs)) / 2 - w / 2, y: (Math.max(...ys) + Math.min(...ys)) / 2 - ht / 2, w, h: ht });
    };
    view.querySelector(".zoombtns").onclick = e => { const z = e.target.dataset.z; if (z === "in") zoom(1 / 1.5); if (z === "out") zoom(1.5); if (z === "fit") fit(); };
    view.querySelector(".legtable").onclick = e => { const tr = e.target.closest("tr[data-t]"); if (tr) { m.target = tr.dataset.t; h.rerender(); } };
    const assign = $("#mAssign");
    if (assign) assign.onclick = () => {
      const codes = [...m.selected];
      h.act(x => S.assignAreas(x, h.ui.sid, m.ff, codes, m.target === "__none__" ? null : m.target),
        () => { m.selected.clear(); h.toast(`${codes.length} area${codes.length === 1 ? "" : "s"} ${m.target === "__none__" ? "cleared" : "assigned to " + m.target}.`); });
    };
    const clear = $("#mClear");
    if (clear) clear.onclick = () => { m.selected.clear(); h.rerender(); };
    bindAreas();
  }

  const $ = s => h.view.querySelector(s);

  function areasSection() {
    const g = h.data.geo;
    return `<section><h2>Map areas</h2>
      ${g ? `<p>${g.units.length} ${g.kind === "brick" ? "bricks" : "postal-code areas"} from <b>${esc(g.source || "imported file")}</b>.
        ${g.kind === "brick" ? "Accounts are placed in a brick by their <code>brick</code> column." : "Accounts are placed in an area by the start of their postal code."}</p>` : ""}
      <p class="muted">Import boundaries as a GeoJSON file in longitude/latitude (WGS84). Brick files usually come from your data provider; postal-code areas from a map data supplier or your GIS team.
        Accounts can also have <code>lat</code> and <code>lon</code> columns to show as dots.</p>
      <div class="row2"><button class="btn" data-g="import">Import map areas (GeoJSON)…</button>
        <button class="btn ghost" data-g="demo">Use demo map of Sweden</button>
        ${g ? `<button class="btn danger" data-g="remove">Remove map areas</button>` : ""}</div>
      <div id="geoImport"></div></section>`;
  }

  function renderEmpty(view) {
    view.innerHTML = `<section><h2>Map</h2><p>No map areas yet. Import bricks or postal-code areas to see your territories on a map and assign areas by clicking them.</p>
      <p class="muted">The map is drawn from the boundaries you import, so it works offline and nothing is sent anywhere.</p></section>${areasSection()}`;
    bindAreas();
  }

  function bindAreas() {
    h.view.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const g = b.dataset.g;
      if (g === "demo") h.act(x => S.setGeography(x, TMDemo.geography()), () => h.toast("Demo map loaded. The shapes are approximate."));
      if (g === "remove" && confirm("Remove the map areas? Territory rules are kept.")) h.act(x => S.clearGeography(x));
      if (g === "import") startImport();
    });
    if (h.ui.pendingGeo) showImportForm();
  }

  function startImport() {
    h.pickFile(".geojson,.json,application/geo+json,application/json", async f => {
      const gj = JSON.parse(await f.text());
      const feats = gj.type === "FeatureCollection" ? gj.features : gj.type === "Feature" ? [gj] : null;
      if (!feats || !feats.length) throw new Error("This is not a GeoJSON file with features.");
      h.ui.pendingGeo = { gj, name: f.name, feats };
      h.ui.tab = "map";
      h.rerender();
    });
  }

  function showImportForm() {
    const p = h.ui.pendingGeo, el = $("#geoImport");
    if (!el) return;
    const keys = [...new Set(p.feats.slice(0, 200).flatMap(f => Object.keys(f.properties || {})))];
    if (!keys.length) { h.ui.pendingGeo = null; return h.toast("The features in this file have no properties to use as codes.", true); }
    const guess = re => keys.find(k => re.test(k)) || "";
    const codeKey = guess(/brick/i) || guess(/post|zip|plz|nr|code|kod|id/i) || keys[0];
    const nameKey = guess(/name|namn|ort|city|label/i);
    const sample = k => p.feats.slice(0, 3).map(f => f.properties?.[k]).filter(v => v != null).map(v => String(v).slice(0, 20)).join(", ");
    el.innerHTML = `<div class="importbox"><h2>Import ${esc(p.name)}: ${p.feats.length} features</h2>
      <form id="fGeoImp" class="row">
        <label>Code is in <select name="code">${keys.map(k => `<option ${k === codeKey ? "selected" : ""} value="${esc(k)}">${esc(k)} (${esc(sample(k))})</option>`).join("")}</select></label>

/* Territory Manager user interface. Everything runs in the browser; nothing is sent anywhere. */
(function (E, S, Demo, TMMap) {
  "use strict";

  const LS_KEY = "territory-manager.data.v1";
  const TABS = { territories: "Territories", map: "Map", accounts: "Accounts", rules: "Rules", scenarios: "Scenarios", feedback: "Field requests" };
  const ui = { tab: "territories", sid: S.MASTER, data: null, fileHandle: null, fileName: null, dirty: false, saving: null };

  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const formData = f => Object.fromEntries(new FormData(f));
  const today = () => new Date().toISOString().slice(0, 10);
  const condText = c => `${esc(c.field)} <b>${esc(c.op)}</b> ${esc(Array.isArray(c.value) ? c.value.join(" | ") : c.value)}`;
  const parseValue = (op, v) => (op === "in" || op === "not_in") ? String(v).split("|").map(x => x.trim()).filter(Boolean)
    : (op === "gte" || op === "lte") ? Number(String(v).replace(",", ".")) : v;

  function toast(msg, isError = false) {
    const t = $("#toast");
    t.textContent = msg; t.className = isError ? "err" : ""; t.style.display = "block";
    clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), isError ? 6000 : 3500);
  }

  // ---------- persistence ----------
  // 1) Always kept in this browser (localStorage) so nothing is lost on close.
  // 2) Optionally linked to a data file: in Edge/Chrome changes save straight to it;
  //    elsewhere "Save" downloads a copy.
  const canLinkFiles = typeof window.showSaveFilePicker === "function";

  // Browser copy lives in IndexedDB (room for large map files), falling back to localStorage.
  let idbPromise = null, lastGeo, storeWarning = "";
  function idb() {
    if (!idbPromise) idbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("no IndexedDB"));
      const req = indexedDB.open("territory-manager", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbPromise;
  }
  const idbGet = (db, key) => new Promise((res, rej) => { const r = db.transaction("kv").objectStore("kv").get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  async function persistLocal() {
    const data = ui.data;
    if (!data) return;
    const { geo, ...rest } = data;
    try {
      const db = await idb();
      await new Promise((res, rej) => {
        const tx = db.transaction("kv", "readwrite"), store = tx.objectStore("kv");
        store.put(JSON.stringify(rest), "data");
        if (geo !== lastGeo) store.put(geo ? JSON.stringify(geo) : null, "geo");
        tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
      });
      lastGeo = geo;
      try { localStorage.removeItem(LS_KEY); } catch {}
      storeWarning = "";
    } catch {
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); storeWarning = ""; }
      catch { storeWarning = "Could not keep a copy in this browser: use File → Save to keep your work."; }
    }
    renderFileStatus();
  }

  async function loadLocal() {
    try {
      const db = await idb();
      const [d, g] = await Promise.all([idbGet(db, "data"), idbGet(db, "geo")]);
      if (d) { const obj = JSON.parse(d); if (g) obj.geo = JSON.parse(g); return obj; }
    } catch {}
    try { const t = localStorage.getItem(LS_KEY); if (t) return JSON.parse(t); } catch {}
    return null;
  }

  async function forgetLocal() {
    try { const db = await idb(); await new Promise(r => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").clear(); tx.oncomplete = tx.onerror = r; }); } catch {}
    try { localStorage.removeItem(LS_KEY); } catch {}
    lastGeo = undefined;
  }

  function changed() {
    ui.dirty = true;
    persistLocal();
    if (ui.fileHandle) scheduleFileSave();
    renderFileStatus();
  }

  function scheduleFileSave() {
    clearTimeout(ui.saving);
    ui.saving = setTimeout(() => writeHandle(ui.fileHandle).catch(err => toast("Could not save to the file: " + err.message, true)), 400);
  }

  async function writeHandle(handle) {
    const w = await handle.createWritable();
    await w.write(JSON.stringify(ui.data, null, 1));
    await w.close();
    ui.dirty = false;
    renderFileStatus();
  }

  function download(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function saveAs() {
    const name = ui.fileName || `territory-data-${today()}.json`;

        ui.fileHandle = h; ui.fileName = h.name;
        await writeHandle(h);
        toast(`Saved. Changes now save automatically to ${h.name}.`);
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
        // fall through to a plain download (e.g. blocked by policy)
      }
    }
    download(name, JSON.stringify(ui.data, null, 1), "application/json");
    ui.fileName = name; ui.dirty = false; renderFileStatus();
    toast(`Downloaded ${name}. Open it later with File → Open.`);
  }

  const save = () => (ui.fileHandle ? writeHandle(ui.fileHandle).then(() => toast("Saved.")) : saveAs()).catch(err => toast(err.message, true));

  function useData(data, { fileName = null, handle = null, dirty = false } = {}) {
    ui.data = data; ui.fileHandle = handle; ui.fileName = fileName; ui.sid = S.MASTER; ui.dirty = dirty;
    persistLocal();
    renderShell();

  async function openFile() {
    if (canLinkFiles && typeof window.showOpenFilePicker === "function") {

        const [h] = await window.showOpenFilePicker({ types: [{ description: "Territory Manager data", accept: { "application/json": [".json"] } }] });

        let writable = h;
        try { if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") writable = null; } catch { writable = null; }

        toast(`Opened ${file.name}${writable ? "; changes save to it automatically" : ""}.`);

        if (err.name === "AbortError") return;

      }

    ["forget", "Remove data from this browser"],

        ${readonly() || noTerr ? "" : `<form class="row" id="fRule"><input name="name" placeholder="Rule name"><input name="field" placeholder="Field, e.g. segment" required size="12">
          <select name="op">${opOptions()}</select><input name="value" placeholder="Value (| between options)" required>
          <input name="field2" placeholder="and field (optional)" size="12"><select name="op2">${opOptions()}</select><input name="value2" placeholder="value">
          <label class="muted">priority <input name="priority" type="number" value="100" style="width:70px"></label><select name="territory">${t}</select><button class="btn">Add rule</button></form>`}</section>
      <section><h2>Geography rules</h2><table><tr><th>Postal code starts with</th><th>Territory</th><th></th></tr>
        ${[...sc.geoRules].sort((a, b) => a.prefix.localeCompare(b.prefix)).map(r => `<tr><td>${esc(r.prefix)}</td><td><span class="tag">${esc(r.territory)}</span></td><td>${del("delRule", `data-kind="geo" data-id="${r.id}"`)}</td></tr>`).join("") || "<tr><td colspan=3 class='muted'>None.</td></tr>"}</table>
        ${readonly() || noTerr ? "" : `<form class="row" id="fGeo"><input name="prefix" placeholder="e.g. 41 or 113,114,115" required size="16"><select name="territory">${t}</select><button class="btn">Add</button></form>
          <p class="muted">Tip: enter several prefixes separated by commas.</p>`}</section>
      <section><h2>Manual assignments</h2><table><tr><th>Account</th><th>Action</th><th>Territory</th><th>Note</th><th></th></tr>
        ${sc.manual.map(r => `<tr><td>${esc(r.account)} <span class="muted">${esc(ui.data.accounts.find(a => a.id === r.account)?.name)}</span></td><td>${esc(r.action)}</td><td><span class="tag">${esc(r.territory)}</span></td>
          <td class="muted">${esc(r.note)}</td><td>${del("delRule", `data-kind="manual" data-id="${r.id}"`)}</td></tr>`).join("") || "<tr><td colspan=5 class='muted'>None.</td></tr>"}</table>
        ${readonly() || noTerr ? "" : `<form class="row" id="fMan"><input name="account" placeholder="Account id" required size="10" list="acctIds"><datalist id="acctIds">${ui.data.accounts.slice(0, 2000).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</datalist>
          <select name="action"><option>include</option><option>exclude</option></select><select name="territory">${t}</select><input name="note" placeholder="Note"><button class="btn">Add</button></form>`}</section>`;

      on({ delRule: ({ kind, id }) => act(x => S.deleteRule(x, ui.sid, kind, id)) }, {
        fRule: v => act(x => {
          const conditions = [{ field: v.field.trim(), op: v.op, value: parseValue(v.op, v.value) }];
          if (v.field2.trim()) conditions.push({ field: v.field2.trim(), op: v.op2, value: parseValue(v.op2, v.value2) });
          return S.addAccountRule(x, ui.sid, { name: v.name, territory: v.territory, priority: Number(v.priority), conditions });
        }),
        fGeo: v => act(x => v.prefix.split(/[,;]/).map(p => p.trim()).filter(Boolean).forEach(prefix => S.addGeoRule(x, ui.sid, { territory: v.territory, prefix }))),
        fMan: v => act(x => S.addManual(x, ui.sid, v)),
      });
    },

    scenarios() {
      const d = ui.data;
      $("#view").innerHTML = `<section><h2>Scenarios</h2>
        <p class="muted">A scenario is a copy of the alignment you can change freely. Compare it with master, then publish to make it the live alignment.</p>
        <table><tr><th>Name</th><th>Status</th><th>Created</th><th></th></tr>
        ${d.scenarios.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${s.status}</td><td class="muted">${esc(s.createdAt.slice(0, 16).replace("T", " "))}</td><td>
          ${s.status === "draft" ? `<button class="btn ghost small" data-a="edit" data-id="${s.id}">Edit</button> <button class="btn ghost small" data-a="diff" data-id="${s.id}">Compare</button>
          <button class="btn small" data-a="publish" data-id="${s.id}">Publish</button> <button class="btn danger small" data-a="del" data-id="${s.id}">Delete</button>` : ""}</td></tr>`).join("")}</table>
        <form class="row" id="fScen"><input name="name" placeholder="Scenario name, e.g. 2027 realignment" required>
          <select name="baseId">${d.scenarios.map(s => `<option value="${s.id}">copy of ${esc(s.name)}</option>`).join("")}</select><button class="btn">Create scenario</button></form></section>
        <section id="diff"><h2>Compare with master</h2><p class="muted">Choose Compare on a draft scenario.</p></section>`;
      const showDiff = id => {
        const ch = S.diff(d, S.MASTER, id), names = new Map(d.accounts.map(a => [a.id, a.name]));
        $("#diff").innerHTML = `<h2>${esc(S.scenario(d, id).name)} vs master: ${ch.length} account${ch.length === 1 ? "" : "s"} move</h2>
          ${ch.length ? `<table><tr><th>Account</th><th>Field force</th><th>Now</th><th>In scenario</th></tr>
          ${ch.map(c => `<tr><td>${esc(c.account)} <span class="muted">${esc(names.get(c.account))}</span></td><td>${esc(c.fieldForce)}</td>
            <td class="rem">${esc(c.before.join(", ") || "—")}</td><td class="add">${esc(c.after.join(", ") || "—")}</td></tr>`).join("")}</table>` : "<p class='muted'>No account moves.</p>"}`;
      };
      on({
        edit: ({ id }) => { ui.sid = Number(id); ui.tab = "rules"; render(); },
        diff: ({ id }) => showDiff(Number(id)),
        publish: ({ id }) => confirm("Make this scenario the live (master) alignment?") &&
          act(x => S.publishScenario(x, id), ch => { ui.sid = S.MASTER; toast(`Published: ${ch.length} account moves.`); }),
        del: ({ id }) => confirm("Delete this scenario?") && act(x => S.deleteScenario(x, id)),
      }, {
        fScen: v => act(x => S.createScenario(x, v.name, Number(v.baseId)), sc => { ui.sid = sc.id; ui.tab = "rules"; toast(`Now editing "${sc.name}". Switch scenarios at the top right.`); }),
      });
    },

    feedback() {
      const d = ui.data, items = [...d.feedback].reverse();
      $("#view").innerHTML = `<section><h2>Request a change</h2>
        <p class="muted">Reps ask to add or drop an account in a live territory. Approving turns the request into a manual assignment on master.
        To collect requests from colleagues, they can make them in their copy and send you the data file, or simply email you the details.</p>
        ${S.scenario(d, S.MASTER).territories.length ? `<form class="row" id="fFb"><input name="requestedBy" placeholder="Your name" required>
          <select name="action"><option value="add">add</option><option value="drop">drop</option></select>
          <input name="account" placeholder="Account id" required size="10" list="acctIds2"><datalist id="acctIds2">${d.accounts.slice(0, 2000).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</datalist>
          <select name="territory">${terrOptions(S.MASTER)}</select><input name="comment" placeholder="Reason"><button class="btn">Submit</button></form>` : "<p class='muted'>Add territories first.</p>"}</section>
        <section><h2>Requests</h2><table><tr><th>#</th><th>Request</th><th>By</th><th>Reason</th><th>Status</th><th></th></tr>
        ${items.map(f => `<tr><td>${f.id}</td><td>${f.action} <b>${esc(f.account)}</b> ${f.action === "add" ? "to" : "from"} <span class="tag">${esc(f.territory)}</span></td>
          <td>${esc(f.requestedBy)}</td><td class="muted">${esc(f.comment)}</td><td>${f.status}${f.resolvedBy ? ` <span class="muted">by ${esc(f.resolvedBy)}</span>` : ""}</td>
          <td>${f.status === "pending" ? `<button class="btn small" data-a="ok" data-id="${f.id}">Approve</button> <button class="btn danger small" data-a="no" data-id="${f.id}">Reject</button>` : ""}</td></tr>`).join("")
          || "<tr><td colspan=6 class='muted'>No requests yet.</td></tr>"}</table></section>`;
      on({
        ok: ({ id }) => act(x => S.resolveFeedback(x, id, true)),
        no: ({ id }) => act(x => S.resolveFeedback(x, id, false)),
      }, { fFb: v => act(x => S.submitFeedback(x, v), () => toast("Request submitted.")) });
    },
  };

  // ---------- start ----------
  function start() {
    $("#tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}">${v}</button>`).join("");
    $("#tabs").onclick = e => { const k = e.target.dataset.tab; if (k) { ui.tab = k; try { localStorage.setItem(LS_KEY + ".tab", k); } catch {} render(); } };
    $("#scenario").onchange = e => { ui.sid = Number(e.target.value); render(); };
    $("#menuItems").innerHTML = MENU.map(m => m === "-" ? "<hr>" : `<button data-m="${m[0]}">${m[1]}</button>`).join("");
    $("#menuBtn").onclick = e => { e.stopPropagation(); $("#menuBox").classList.toggle("open"); };
    $("#menuItems").onclick = e => { const m = e.target.dataset.m; if (m) { $("#menuBox").classList.remove("open"); MENU_ACTIONS[m](); } };
    document.addEventListener("click", () => $("#menuBox").classList.remove("open"));
    document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s" && ui.data) { e.preventDefault(); save(); } });
    window.addEventListener("beforeunload", e => { if (ui.data && ui.dirty && !ui.fileHandle && storeWarning) { e.preventDefault(); e.returnValue = ""; } });

    try { ui.tab = localStorage.getItem(LS_KEY + ".tab") || ui.tab; } catch {}
    if (!TABS[ui.tab]) ui.tab = "territories";
    $("#view").innerHTML = "<p class='muted'>Loading…</p>";
    loadLocal().then(saved => {
      if (saved) {
        try { ui.data = S.load(saved); ui.dirty = true; lastGeo = ui.data.geo; }
        catch (err) { toast("Could not read the data kept in this browser: " + err.message, true); }
      }
      renderShell();
    });
  }

  start();
})(TMEngine, TMStore, TMDemo, TMMap);

</script>
</body>
</html>
