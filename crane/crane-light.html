<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tower crane</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

/main><script type="module">const AZIMUTH = 45;

// World units: 2.5 per metre. x, y on the site plate, z up, mast axis at the origin.
const M = 2.5;

const C = {
  mast: 4,
  mastBase: 6,
  mastTop: 106,
  section: 12.5,
  ringR: 6.4,
  ttZ: 110,
  ttTop: 113.2,
  jibZ: 114,
  jibTop: 122,
  jibV: 3.6,
  jibRoot: 7,
  jibTip: 157,
  panel: 6.25,
  apex: 154,
  cjEnd: -52,
  uMin: 10,
  uMax: 150,
  trolleyLow: 109.6,
  sheaveZ: 108.2,
  sling: 8,
  travel: 74,
};

// Load chart of an 8 t flat-top crane with a 60 m jib: 8 t out to 22.6 m, 1.9 t at the tip.
const CHART = { max: 8, full: 22.6, k: 93.2, c: 10.95, tip: 60 };
const capacityAt = (metres) => (metres <= CHART.full ? CHART.max : CHART.k / (metres - CHART.c));
const reachFor = (tonnes) => (tonnes >= CHART.max ? CHART.full : Math.min(CHART.tip, CHART.c + CHART.k / tonnes));

// The load: three HEB 320 beams, 8 m long, 127 kg/m, on two timber bearers.
const LOAD = { mass: 3.05, half: 10, beam: 0.8, gap: 0.95, bearer: 0.7, top: 1.5, lift: 6 };

// Site layout.
const PLATE = { x: -120, y: -120, w: 240, d: 240, r: 6 };
const BUILDING = { x: -108, y: 12, w: 46, d: 36, deck: 30 };
const YARD_SPOT = { x: 40, y: -30, yaw: -0.35 };
const DECK_SPOT = { x: -85, y: 30 };
const OBSTACLES = [
  { x: -16, y: -16, w: 32, d: 32 },
  { x: 54, y: -72, w: 24, d: 22 },
  { x: 8, y: 74, w: 30, d: 16 },
];

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = (a) => mul(a, 1 / (Math.hypot(a[0], a[1], a[2]) || 1));
const mean = (points) => mul(points.reduce(add, [0, 0, 0]), 1 / points.length);
const lerp = (a, b, t) => add(a, mul(sub(b, a), t));

function viewOf(P) {
  const c = cameraOf(P);
  return [c.cosA * c.cosE, c.sinA * c.cosE, c.sinE];
}

function hull2(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const turn = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && turn(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && turn(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

// Any convex polyhedron given as faces of 3D points: the kit's SolidPaths, shaded like extrude.
function polySolid(faces, P) {
  const V = viewOf(P);
  const c = cameraOf(P);
  const centre = mean(faces.flat());
  const key = (p) => p.map((v) => v.toFixed(3)).join(",");
  const edges = new Map();
  const shades = [[], [], [], []];
  const tops = [];
  for (const face of faces) {
    let n = unit(cross(sub(face[1], face[0]), sub(face[2], face[0])));
    if (dot(n, sub(mean(face), centre)) < 0) n = mul(n, -1);
    const seen = dot(n, V) > 1e-6;
    face.forEach((p, i) => {
      const q = face[(i + 1) % face.length];
      const id = [key(p), key(q)].sort().join("|");
      const edge = edges.get(id) ?? { p, q, seen: 0 };
      if (seen) edge.seen++;
      edges.set(id, edge);
    });
    if (!seen) continue;
    const d = pathOf(face.map((p) => iso(p, P)), true);
    if (n[2] > 0.6) tops.push(d);
    else {
      const h = Math.hypot(n[0], n[1]) || 1;
      const lit = n[2] < -0.2 ? 0 : ((n[0] / h) * -c.sinA + (n[1] / h) * c.cosA + 1) / 2;
      shades[Math.min(3, Math.max(0, Math.floor(lit * 4)))].push(d);
    }
  }
  const outline = [];
  const crease = [];
  for (const { p, q, seen } of edges.values()) {
    if (seen === 1) outline.push(pathOf([iso(p, P), iso(q, P)]));
    if (seen === 2) crease.push(pathOf([iso(p, P), iso(q, P)]));
  }
  return {
    fill: pathOf(hull2(faces.flat().map((p) => iso(p, P))), true),
    outline: outline.join(""),
    crease: crease.join(""),
    top: tops.join(""),
    shades: shades.map((list) => list.join("")),
  };
}

// A box from its centre and three half-axes.
function boxFaces(o, a, b, h) {
  const at = (i, j, k) => add(add(add(o, mul(a, i)), mul(b, j)), mul(h, k));
  return [
    [at(-1, -1, 1), at(1, -1, 1), at(1, 1, 1), at(-1, 1, 1)],
    [at(-1, -1, -1), at(-1, 1, -1), at(1, 1, -1), at(1, -1, -1)],
    [at(1, -1, -1), at(1, 1, -1), at(1, 1, 1), at(1, -1, 1)],
    [at(-1, -1, -1), at(-1, -1, 1), at(-1, 1, 1), at(-1, 1, -1)],
    [at(-1, 1, -1), at(-1, 1, 1), at(1, 1, 1), at(1, 1, -1)],
    [at(-1, -1, -1), at(1, -1, -1), at(1, -1, 1), at(-1, -1, 1)],
  ];
}

// A short cylinder on any axis: n-gon caps and side quads.
function drumFaces(o, axis, r, half, n = 18) {
  const a = unit(axis);
  const u = unit(Math.abs(a[2]) > 0.9 ? cross(a, [1, 0, 0]) : cross(a, [0, 0, 1]));
  const v = cross(a, u);
  const ring = (s) => Array.from({ length: n }, (_, i) => {
    const t = (i / n) * Math.PI * 2;
    return add(add(o, mul(a, s)), add(mul(u, Math.cos(t) * r), mul(v, Math.sin(t) * r)));
  });
  const p = ring(-half);
  const q = ring(half);
  const faces = [p, q];
  for (let i = 0; i < n; i++) faces.push([p[i], p[(i + 1) % n], q[(i + 1) % n], q[i]]);
  return { faces, u, v, a };
}

// A slender member: an outline stroke under a paper stroke, both in viewBox units.
function barSvg(a, b, w, P, tone = "mid", butt = false) {
  const d = pathOf([iso(a, P), iso(b, P)]);
  const k = cameraOf(P).k;
  return `<g class="cr-bar" data-tone="${tone}"${butt ? " data-butt" : ""}><path class="cr-o" d="${d}" stroke-width="${(w * k + 0.9).toFixed(2)}"/><path class="cr-i" d="${d}" stroke-width="${(w * k).toFixed(2)}"/></g>`;
}

function polyBarSvg(points, w, P, tone = "mid") {
  const d = pathOf(points.map((p) => iso(p, P)));
  const k = cameraOf(P).k;
  return `<g class="cr-bar" data-tone="${tone}"><path class="cr-o" d="${d}" stroke-width="${(w * k + 0.9).toFixed(2)}"/><path class="cr-i" d="${d}" stroke-width="${(w * k).toFixed(2)}"/></g>`;
}

// The slewing frame: local u along the jib, v across it, z up.
function frameOf(theta, origin = [0, 0, 0]) {
  const c = Math.cos(theta);
  const s = Math.sin(theta);
  return {
    theta,
    at: ([u, v, z]) => [origin[0] + u * c - v * s, origin[1] + u * s + v * c, origin[2] + z],
    dir: ([u, v, z]) => [u * c - v * s, u * s + v * c, z],
  };
}

// A vertical prism in the local frame: a rounded plan rotated onto the floor.
function localSlab(F, plan, z, h, P, steps = 2, bevel = 0) {
  return extrude(roundedPlan(plan, steps).map(([u, v]) => F.at([u, v, 0]).slice(0, 2)), F.at([0, 0, z])[2], h, P, { bevel });
}

const quad = (F, list, P) => pathOf(list.map((p) => iso(F.at(p), P)), true);
const segL = (F, a, b, P) => pathOf([iso(F.at(a), P), iso(F.at(b), P)]);

function trolleyItems(P, F, t) {
  const items = [];
  const put = (at, svg, bias = 0) => items.push({ key: depthOf(F.at(at), P) + bias, svg });
  for (const side of [-1, 1]) {
    const v0 = side * 4.3;
    const plate = localSlab(F, { x: t - 3.6, y: Math.min(v0, v0 + side * 0.6), w: 7.2, d: 0.6, r: 0 }, C.trolleyLow, 5.6, P, 0);
    const wheels = [-2.2, 2.2].map((du) => polySolid(drumFaces(F.at([t + du, side * 3.6, C.jibZ + 0.9]), F.dir([0, 1, 0]), 0.9, 0.3, 12).faces, P));
    put([t, side * 4.3, C.trolleyLow + 3], wheels.map((w) => solidSvg(w, { tone: "mid", crease: "none" })).join("") + solidSvg(plate, { tone: "mid" }) +
      dotsSvg([-2.2, 2.2].map((du) => iso(F.at([t + du, side * (4.3 + (side > 0 ? 0.6 : 0)) , C.jibZ + 0.9]), P)), { size: 0.45, tone: "hi" }));
  }
  const body = localSlab(F, { x: t - 3.2, y: -4.3, w: 6.4, d: 8.6, r: 0.6 }, C.trolleyLow, 2.2, P, 2, 0.3);
  const sheaves = [-1.3, 1.3].map((v) => polySolid(drumFaces(F.at([t, v, C.sheaveZ + 0.2]), F.dir([0, 1, 0]), 1.5, 0.35, 16).faces, P));
  const drops = lineSvg(pathOf([iso(F.at([t - 1.6, -1.3, C.jibZ + 1.1]), P), iso(F.at([t - 1.6, -1.3, C.trolleyLow + 1]), P)]) + pathOf([iso(F.at([t + 1.6, 1.3, C.jibZ + 1.1]), P), iso(F.at([t + 1.6, 1.3, C.trolleyLow + 1]), P)]), { tone: "lit", className: "cr-rope" });
  put([t, 0, C.trolleyLow], drops + sheaves.map((s) => solidSvg(s, { tone: "mid", crease: "none" })).join("") + solidSvg(body, { tone: "mid" }) +
    dotsSvg([[-2.4, -3.4], [2.4, -3.4], [-2.4, 3.4], [2.4, 3.4]].map(([du, v]) => iso(F.at([t + du, v, C.trolleyLow + 2.2]), P)), { size: 0.4, tone: "mid" }), 0.2);
  return items;
}

// Everything that turns with the slewing ring, as depth-keyed items.
function superItems(P, theta, t) {
  const F = frameOf(theta);
  const items = [];
  const put = (at, svg, bias = 0) => items.push({ key: depthOf(F.at(at), P) + bias, svg });
  const bar = (a, b, w, tone = "mid", bias = 0, butt = false) => put(mean([a, b]), barSvg(F.at(a), F.at(b), w, P, tone, butt), bias);

  // Slewing ring (upper race) and turntable.
  const race = polySolid(drumFaces(F.at([0, 0, 108.2]), [0, 0, 1], C.ringR, 1, 40).faces, P);
  const bolts = Array.from({ length: 16 }, (_, i) => {
    const a = (i / 16) * Math.PI * 2;
    return F.at([Math.cos(a) * (C.ringR - 0.9), Math.sin(a) * (C.ringR - 0.9), 109.2]);
  }).filter(([x, y]) => depthOf([x, y, 0], P) > -2.5);
  put([0, 0, 106], solidSvg(race, { tone: "mid" }) + dotsSvg(bolts.map((p) => iso(p, P)), { size: 0.4, tone: "mid" }), -30);

function drive(s, dt, calm) {
  if (calm) {
    s.x = s.target;
    s.v = 0;
    return;
  }
  const d = s.target - s.x;
  const brake = Math.sign(d) * Math.sqrt(2 * s.amax * Math.abs(d));
  const want = clamp(brake, -s.vmax, s.vmax);
  s.v += clamp(want - s.v, -s.amax * dt, s.amax * dt);
  s.x += s.v * dt;
  if (Math.abs(s.target - s.x) < s.amax * 2e-3 && Math.abs(s.v) < s.amax * 0.06) {
    s.x = s.target;
    s.v = 0;
  }
}
const resting = (s) => s.x === s.target && s.v === 0;

const reach = () => (load.carried ? reachFor(LOAD.mass) * M : C.uMax);
let blocked = false;
function aim(x, y) {
  const want = Math.atan2(y, x);
  let delta = (want - slew.x) % TAU;
  if (delta > Math.PI) delta -= TAU;
  if (delta < -Math.PI) delta += TAU;
  slew.target = slew.x + delta;
  const r = Math.hypot(x, y);
  blocked = r > reach() + 0.01;
  trolley.target = clamp(r, C.uMin, Math.min(C.uMax, reach()));
}

function plumb() {
  const c = Math.cos(slew.x);
  const s = Math.sin(slew.x);
  return [trolley.x * c + sway.x, trolley.x * s + sway.y];
}

function inside(px, py, r, pad = 0) {
  return px > r.x + pad && px < r.x + r.w - pad && py > r.y + pad && py < r.y + r.d - pad;
}
function footprint(x, y, yaw) {
  const pts = [];
  for (const a of [-LOAD.half, -LOAD.half / 2, 0, LOAD.half / 2, LOAD.half]) {
    for (const b of [-2.2, 0, 2.2]) pts.push([x + a * Math.cos(yaw) - b * Math.sin(yaw), y + a * Math.sin(yaw) + b * Math.cos(yaw)]);
  }
  return pts;
}
// Where the load could land under the hook: on the deck, on clear ground, or nowhere.
function landing(x, y, yaw) {
  const pts = footprint(x, y, yaw);
  if (pts.every(([px, py]) => inside(px, py, BUILDING, 1))) return { z: BUILDING.deck, at: "deck" };
  const clear = pts.every(([px, py]) => inside(px, py, PLATE, 7) && !inside(px, py, BUILDING, -1) && !OBSTACLES.some((o) => inside(px, py, o, -1)));
  if (!clear) return null;
  return { z: 0, at: Math.hypot(x - YARD_SPOT.x, y - YARD_SPOT.y) < 4 ? "yard" : "ground" };
}

// Jobs: a queue of steps, each with a start and a test for done.
let queue = [];
let step = null;
let job = "";
let message = "";
let messageUntil = 0;
const say = (text, ms = 1800) => {
  message = text;
  messageUntil = performance.now() + ms;
};
const steps = {
  go: (x, y) => ({ start: () => aim(x, y), done: () => resting(slew) && resting(trolley) && resting(hoist) }),
  settle: () => ({ start: () => {}, done: () => Math.hypot(sway.x, sway.y) < 0.5 }),
  hoist: (z) => ({ start: () => { hoist.target = z; }, done: () => resting(hoist) }),
  attach: () => ({ start: () => {
    const [x, y] = plumb();
    load.carried = true;
    load.offset = load.yaw - slew.x;
    load.dx = load.x - x;
    load.dy = load.y - y;
  }, done: () => true }),
  detach: (at) => ({ start: () => {
    load.carried = false;
    load.at = at;
  }, done: () => true }),
  wait: (s) => {
    let until = 0;
    return { start: () => { until = performance.now() + s * 1000; }, done: () => performance.now() >= until };
  },
};
function run(list, name) {
  queue = list;
  step = null;
  job = name;
}

function pickJob() {
  return [
    steps.go(load.x, load.y),
    steps.settle(),
    steps.hoist(load.z + LOAD.top + C.sling),
    steps.attach(),
    steps.hoist(C.travel),
  ];
}
function dropJob(z, at) {
  return [steps.settle(), steps.hoist(z + LOAD.top + C.sling), steps.detach(at), steps.wait(0.4), steps.hoist(C.travel)];
}

function act() {
  if (job) return;
  const x = trolley.target * Math.cos(slew.target);
  const y = trolley.target * Math.sin(slew.target);
  if (!load.carried) {
    if (Math.hypot(load.x - x, load.y - y) < 7) run(pickJob(), "lift");
    else say("nothing under the hook to lift");
    return;
  }
  const spot = landing(x, y, slew.target + load.offset);
  if (!spot) {
    say("no clear place to set down here");
    return;
  }
  const z = spot.at === "deck" ? BUILDING.deck : 0;
  run([steps.go(x, y), ...dropJob(z, spot.at)], "set down");
}

// The idle tour: carry the beams up to the deck, wait, bring them back to the yard.
let touring = !still.matches;
function tourJob() {
  if (load.carried) {
    const to = load.from === "deck" ? YARD_SPOT : DECK_SPOT;
    const z = to === DECK_SPOT ? BUILDING.deck : 0;
    return [steps.hoist(C.travel), steps.go(to.x, to.y), ...dropJob(z, to === DECK_SPOT ? "deck" : "yard"), steps.wait(1.6)];
  }
  const from = load.at;
  const to = from === "deck" ? YARD_SPOT : DECK_SPOT;
  return [
    steps.hoist(C.travel),
    ...pickJob(),
    { start: () => { load.from = from; }, done: () => true },
    steps.go(to.x, to.y),
    ...dropJob(to === DECK_SPOT ? BUILDING.deck : 0, to === DECK_SPOT ? "deck" : "yard"),
    steps.wait(1.6),
  ];
}

function advance() {
  for (let guard = 0; guard < 8; guard++) {
    if (step && !step.done()) return;
    step = queue.shift() ?? null;
    if (!step) {
      job = "";
      if (touring) run(tourJob(), "tour");
      else return;
      step = queue.shift();
    }
    step.start();
  }
}

// Pendulum sway of the hook under the trolley's acceleration (time-lapsed with the drives).
function swing(dt, calm) {
  const c = Math.cos(slew.x);
  const s = Math.sin(slew.x);
  const T = [trolley.x * c, trolley.x * s];
  if (calm || !lastTrolley) {
    lastTrolley = T;
    lastVel = [0, 0];
    if (calm) Object.assign(sway, { x: 0, y: 0, vx: 0, vy: 0 });
    return;
  }
  const vel = [(T[0] - lastTrolley[0]) / dt, (T[1] - lastTrolley[1]) / dt];
  const acc = [(vel[0] - lastVel[0]) / dt, (vel[1] - lastVel[1]) / dt];
  lastTrolley = T;
  lastVel = vel;
  const length = Math.max(8, C.sheaveZ - hoist.x);
  const g = 24.5 * 25;
  const w2 = g / length;
  const damp = 2 * 0.16 * Math.sqrt(w2);
  const n = 4;
  for (let i = 0; i < n; i++) {
    const h = dt / n;
    sway.vx += (-w2 * sway.x - damp * sway.vx - clamp(acc[0], -400, 400)) * h;
    sway.vy += (-w2 * sway.y - damp * sway.vy - clamp(acc[1], -400, 400)) * h;
    sway.x += sway.vx * h;
    sway.y += sway.vy * h;
  }
  const r = Math.hypot(sway.x, sway.y);
  if (r > 6) {
    sway.x *= 6 / r;
    sway.y *= 6 / r;
  }
}

let order = "";
let lastHigh = "";
function draw() {
  const theta = slew.x;
  const t = trolley.x;
  const hook = hoist.x;
  const highKey = `${theta.toFixed(4)}|${t.toFixed(2)}`;
  if (highKey !== lastHigh) {
    lastHigh = highKey;
    high.innerHTML = superItems(P, theta, t).sort((a, b) => a.key - b.key).map((item) => item.svg).join("");
  }
  const [hx, hy] = plumb();
  const apex = [hx, hy, hook];
  if (load.carried) {
    load.yaw = theta + load.offset;
    load.x = hx + (load.dx ?? 0);
    load.y = hy + (load.dy ?? 0);
    load.z = hook - C.sling - LOAD.top;
    load.dx = (load.dx ?? 0) * 0.9;
    load.dy = (load.dy ?? 0) * 0.9;
  }
  hookG.innerHTML = (load.carried ? loadSvg(P, [load.x, load.y, load.z], load.yaw, { slung: apex }) : "") + hookSvg(P, theta, t, hook, [sway.x, sway.y]);
  loadG.innerHTML = load.carried ? "" : loadSvg(P, [load.x, load.y, load.z], load.yaw);

  // Painter's order for the low layer: floor depth, and anything over the deck goes after the building.
  const overDeck = (x, y, z) => inside(x, y, BUILDING, -1) && z >= BUILDING.deck - 0.5;
  const keyOf = (x, y, z) => (overDeck(x, y, z) ? buildingKey + 0.5 + depthOf([x, y, 0], P) * 1e-3 : depthOf([x, y, 0], P));
  const items = statics.map((s) => ({ el: s.el, key: s.key, id: s.id }));
  items.push({ el: hookG, key: keyOf(hx, hy, load.carried ? load.z : hook) + 0.01, id: "hook" });
  if (!load.carried) items.push({ el: loadG, key: keyOf(load.x, load.y, load.z), id: "load" });
  items.sort((a, b) => a.key - b.key);
  const next = items.map((i) => i.id).join(",");
  if (next !== order) {
    order = next;
    items.forEach((i) => low.appendChild(i.el));
  }

  // Marks on the ground: where the hook would land, and the limiter's radius while loaded.
  const z = groundAt(hx, hy);
  const plumbMark = lineSvg(ring(hx, hy, 2.4, z, P, 24) + lineOnTop([hx - 2.4, hy], [hx + 2.4, hy], z, P) + lineOnTop([hx, hy - 2.4], [hx, hy + 2.4], z, P), { tone: "lit" });
  const limit = load.carried ? lineSvg(ring(0, 0, reachFor(LOAD.mass) * M, 0, P, 180), { tone: blocked ? "lit" : "hi", dashed: true, className: "cr-limit" }) : "";
  marks.innerHTML = limit + (z === 0 ? plumbMark : "");
  if (z !== 0) hookG.insertAdjacentHTML("afterbegin", plumbMark);

  const metres = t / M;
  const cap = capacityAt(metres);
  let text;
  if (performance.now() < messageUntil) text = message;
  else if (load.carried && blocked && trolley.x >= reach() - 0.05) text = `limiter: ${LOAD.mass.toFixed(2)} t stops at ${reachFor(LOAD.mass).toFixed(1)} m`;
  else if (load.carried) text = `R ${metres.toFixed(1)} m · H ${(hook / M).toFixed(1)} m · ${LOAD.mass.toFixed(2)} of ${cap.toFixed(2)} t (${Math.round((100 * LOAD.mass) / cap)}%)`;
  else text = `R ${metres.toFixed(1)} m · H ${(hook / M).toFixed(1)} m · hook free · ${cap.toFixed(1)} t here`;
  if (readout.textContent !== text) readout.textContent = text;
  const deg = ((((theta * 180) / Math.PI) % 360) + 360) % 360;
  stage.dataset.state = `${deg.toFixed(0)}|${metres.toFixed(1)}|${(hook / M).toFixed(1)}|${load.carried ? "carried" : load.at}|${job}`;
}

let frame = 0;
let last = 0;
let visible = false;
let idleTimer = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  advance();
  drive(slew, dt, calm);
  drive(trolley, dt, calm);
  drive(hoist, dt, calm);
  swing(dt, calm);
  draw();
  const quiet = !job && resting(slew) && resting(trolley) && resting(hoist) && Math.hypot(sway.x, sway.y, sway.vx, sway.vy) < 0.02 && performance.now() > messageUntil;
  frame = visible && !quiet ? requestAnimationFrame(tick) : 0;
}
const wake = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
function interrupt() {
  touring = false;
  if (job === "tour") {
    queue = [];
    step = null;
    job = "";
    hoist.target = C.travel;
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    touring = !still.matches;
    wake();
  }, 9000);
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) wake();
}, { rootMargin: "120px 0px" }).observe(stage);

function floorAt(event) {
  const m = svg.getScreenCTM();
  if (!m) return null;
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  const at = (z) => {
    const a = (p.x - P.origin[0]) / cam.k;
    const b = ((p.y - P.origin[1]) / cam.k + z * cam.cosE) / cam.sinE;
    return [a * cam.sinA + b * cam.cosA, -a * cam.cosA + b * cam.sinA];
  };
  const up = at(BUILDING.deck);
  return inside(up[0], up[1], BUILDING) ? up : at(0);
}

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch" && event.buttons === 0) return;
  interrupt();
  if (job) return;
  const spot = floorAt(event);
  if (!spot) return;
  aim(spot[0], spot[1]);
  hoist.target = C.travel;
  wake();
});
stage.addEventListener("pointerdown", (event) => {
  interrupt();
  if (event.pointerType === "touch") {
    const spot = floorAt(event);
    if (spot && !job) aim(spot[0], spot[1]);
    clearTimeout(stage.tapTimer);
    stage.tapTimer = setTimeout(() => { act(); wake(); }, 0);
  }
  wake();
});
stage.addEventListener("click", (event) => {
  if (event.pointerType === "touch") return;
  interrupt();
  act();
  wake();
});
stage.addEventListener("keydown", (event) => {
  const [x, y] = [trolley.target * Math.cos(slew.target), trolley.target * Math.sin(slew.target)];
  const r = Math.hypot(x, y);
  const a = Math.atan2(y, x);
  let to = null;
  if (event.key === "ArrowLeft") to = [r, a + Math.PI / 12];
  if (event.key === "ArrowRight") to = [r, a - Math.PI / 12];
  if (event.key === "ArrowUp") to = [r + 2.5 * M, a];
  if (event.key === "ArrowDown") to = [r - 2.5 * M, a];
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    interrupt();
    act();
    wake();
    return;
  }
  if (!to) return;
  event.preventDefault();
  interrupt();
  if (job) return;
  aim(to[0] * Math.cos(to[1]), to[0] * Math.sin(to[1]));
  hoist.target = C.travel;
  wake();
});
draw();
</script></body></html>
